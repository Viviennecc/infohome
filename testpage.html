    const { useState, useEffect, useCallback, useMemo } = React;

    // Helper: Number Decimal Formatter
    function formatNumberDecimal(val) {
      if (val === undefined || val === null || val === "" || isNaN(val)) return "--";
      return (Math.round(Number(val) * 10) / 10).toFixed(1);
    }

    // Proxy Fetch Helper to bypass CORS and prevent cached response
    async function fetchWithProxy(url) {
      const timestamp = Date.now();
      const separator = url.includes('?') ? '&' : '?';
      const cacheBustUrl = `${url}${separator}_ts=${timestamp}`;

      const targets = [
        cacheBustUrl,
        `https://corsproxy.io/?${encodeURIComponent(cacheBustUrl)}`,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(cacheBustUrl)}`
      ];

      for (const t of targets) {
        try {
          const res = await fetch(t, { cache: 'no-cache' });
          if (res.ok) {
            const text = await res.text();
            try {
              return JSON.parse(text);
            } catch (e) {
              return text;
            }
          }
        } catch (e) {
          // ignore & try next proxy
        }
      }
      return null;
    }

    // Complete MTR Line and Station dataset

      SIL: { name: "南港島綫", color: "bg-lime-500", stations: [{ code: "ADM", name: "金鐘" }, { code: "OCP", name: "海洋公園" }, { code: "WCH", name: "黃竹坑" }, { code: "LET", name: "利東" }, { code: "SOH", name: "海怡半島" }] },
      TKL: { name: "將軍澳綫", color: "bg-purple-600", stations: [{ code: "NOP", name: "北角" }, { code: "QUB", name: "鰂魚涌" }, { code: "YAT", name: "油塘" }, { code: "TIK", name: "調景嶺" }, { code: "TKO", name: "將軍澳" }, { code: "LHA", name: "坑口" }, { code: "POA", name: "寶琳" }, { code: "LOP", name: "康城" }] },

    };

    function WeatherSection() {
      const [weather, setWeather] = useState(null);
      const [forecast, setForecast] = useState([]);
      const [warnings, setWarnings] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(false);
      const [selectedDistrict, setSelectedDistrict] = useState("將軍澳");
      const [districtSearch, setDistrictSearch] = useState("");
      const [lastRefreshed, setLastRefreshed] = useState("");

      const fetchWeatherData = useCallback(async () => {
        setLoading(true);
        setError(false);

        try {
          const [rhrData, fndData, warnData] = await Promise.all([
            fetchWithProxy("https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc"),
            fetchWithProxy("https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc"),
            fetchWithProxy("https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc")
          ]);

          if (rhrData && typeof rhrData === 'object' && rhrData.temperature) {
            setWeather(rhrData);
          } else {
            setError(true);
          }

          if (fndData && fndData.weatherForecast) {
            setForecast(fndData.weatherForecast);
          }

          const warnList = [];
          if (warnData && typeof warnData === 'object') {
            Object.values(warnData).forEach((w) => {
              if (w && w.name) warnList.push(w.name);
            });
          }
          if (rhrData && Array.isArray(rhrData.warningMessage)) {
            rhrData.warningMessage.forEach((msg) => {
              if (msg && typeof msg === 'string' && !warnList.includes(msg)) warnList.push(msg);
            });
          }
          setWarnings(warnList);
          setLastRefreshed(new Date().toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
        } catch (err) {
          console.error("Weather error:", err);
          setError(true);
        } finally {
          setLoading(false);
        }
      }, []);

      useEffect(() => {
        fetchWeatherData();
        // Updated every 1 minute (60,000 ms) for real-time accurate weather data
        const interval = setInterval(fetchWeatherData, 60000);
        return () => clearInterval(interval);
      }, [fetchWeatherData]);

      const districtList = weather?.temperature?.data || [];
      const activeDistrictData =
        districtList.find((d) => d.place.includes(selectedDistrict)) ||
        districtList.find((d) => d.place.includes("將軍澳")) ||
        districtList.find((d) => d.place.includes("香港天文台")) ||
        districtList[0];

      const displayTemp = activeDistrictData?.value;
      const displayPlace = activeDistrictData?.place || selectedDistrict || "全港平均";

      const humidity = weather?.humidity?.data?.[0]?.value;
      const uvObj = weather?.uvindex?.data?.[0];
      const uvIndex = uvObj?.value;
      const uvDesc = uvObj?.desc;

      const weatherIconCode = weather?.icon?.[0];
      const weatherIconUrl = weatherIconCode
        ? `https://www.hko.gov.hk/images/wxicon/pic${weatherIconCode}.png`
        : null;

      const filteredDistricts = districtList.filter(
        (place) =>
          !districtSearch.trim() ||
          place.place.toLowerCase().includes(districtSearch.trim().toLowerCase())
      );

      if (loading && !weather) {
        return (
          <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-700 flex justify-center items-center min-h-[160px]">
            <div className="text-slate-400 flex items-center gap-2 text-sm font-medium">
              <i className="fa-solid fa-spinner fa-spin text-lg text-sky-500"></i>
              <span>正在連線至香港天文台數據庫載入最新天氣...</span>
            </div>
          </div>
        );
      }

      return (
        <div className="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-slate-700 transition-all">
          <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
            <div className="flex items-center gap-2">
              <span className="p-2 rounded-xl bg-amber-500/10 text-amber-600 dark:text-amber-400 font-bold text-sm">
                <i className="fa-solid fa-cloud-sun mr-1.5"></i>香港天文台實時天氣
              </span>
              <span className="text-[11px] px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400">
                每分鐘自動更新
              </span>
            </div>
            <div className="flex items-center gap-3">
              {weather?.updateTime ? (
                <span className="text-xs text-slate-400">
                  天文台發布：{weather.updateTime.substring(11, 16)} (系統已於 {lastRefreshed} 同步)
                </span>
              ) : lastRefreshed ? (
                <span className="text-xs text-slate-400">更新於：{lastRefreshed}</span>
              ) : null}
              <button
                onClick={fetchWeatherData}
                className="px-3 py-1.5 text-xs rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-sky-600 hover:text-white transition flex items-center gap-1.5 font-medium"
              >
                <i className={`fa-solid fa-rotate ${loading ? "fa-spin" : ""}`}></i>
                <span>立即更新</span>
              </button>
            </div>
          </div>

          {error && !weather ? (
            <div className="bg-rose-50 dark:bg-rose-950/30 border border-rose-200 dark:border-rose-900 rounded-xl p-4 text-center text-rose-600 dark:text-rose-400 text-sm">
              <i className="fa-solid fa-triangle-exclamation mr-2"></i>
              天文台數據暫時未能連線，請點擊上方「立即更新」重試。
            </div>
          ) : (
            <>
              <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 pb-4 border-b border-slate-100 dark:border-slate-700">
                <div className="flex items-center gap-4">
                  <div className="w-16 h-16 rounded-2xl bg-amber-500/10 text-amber-500 flex items-center justify-center text-3xl shrink-0 p-1.5 shadow-inner">
                    {weatherIconUrl ? (
                      <img
                        src={weatherIconUrl}
                        alt="Weather Icon"
                        className="w-full h-full object-contain"
                        onError={(e) => {
                          e.target.style.display = 'none';
                          e.target.nextSibling.style.display = 'block';
                        }}
                      />
                    ) : null}
                    <i className="fa-solid fa-cloud-sun" style={{ display: weatherIconUrl ? 'none' : 'block' }}></i>
                  </div>
                  <div>
                    <div className="flex items-baseline gap-2">
                      <span className="text-4xl font-black text-slate-800 dark:text-slate-100 leading-none">
                        {formatNumberDecimal(displayTemp)}°C
                      </span>
                      <span className="px-2.5 py-0.5 rounded-lg bg-sky-500/10 text-sky-600 dark:text-sky-400 font-bold text-xs border border-sky-500/20">
                        <i className="fa-solid fa-location-dot mr-1"></i>
                        {displayPlace}
                      </span>
                    </div>
                    <div className="flex flex-wrap items-center gap-3 text-xs text-slate-500 dark:text-slate-400 mt-2">
                      {humidity !== undefined && humidity !== null && (
                        <span>
                          <i className="fa-solid fa-droplet text-sky-500 mr-1"></i>
                          相對濕度: <strong className="text-slate-700 dark:text-slate-200">{formatNumberDecimal(humidity)}%</strong>
                        </span>
                      )}
                      {uvIndex !== undefined && uvIndex !== null && (
                        <span>
                          <i className="fa-solid fa-sun text-amber-500 mr-1"></i>
                          UV指數: <strong className="text-slate-700 dark:text-slate-200">{formatNumberDecimal(uvIndex)} {uvDesc ? `(${uvDesc})` : ''}</strong>
                        </span>
                      )}
                    </div>
                  </div>
                </div>

                {warnings.length > 0 ? (
                  <div className="flex flex-wrap gap-2">
                    {warnings.map((warn, i) => (
                      <span key={i} className="px-3 py-1.5 rounded-lg bg-rose-500/10 text-rose-600 dark:text-rose-400 font-bold text-xs border border-rose-500/20 flex items-center gap-1.5 animate-pulse">
                        <i className="fa-solid fa-triangle-exclamation"></i>
                        {warn}
                      </span>
                    ))}
                  </div>
                ) : (
                  <div className="text-xs text-emerald-600 dark:text-emerald-400 font-medium px-3 py-1.5 bg-emerald-50 dark:bg-emerald-950/40 rounded-lg border border-emerald-200 dark:border-emerald-800">
                    <i className="fa-solid fa-shield-halved mr-1.5"></i>現時無特別天氣警告
                  </div>
                )}
              </div>

              <div className="mt-4">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-2.5">
                  <h3 className="text-xs font-semibold text-slate-400 uppercase tracking-wider">全港各區最新氣溫（點擊切換地區）</h3>
                  <input
                    type="text"
                    value={districtSearch}
                    onChange={(e) => setDistrictSearch(e.target.value)}
                    placeholder="搜尋地區..."
                    className="px-2.5 py-1 text-xs bg-slate-50 dark:bg-slate-700/50 rounded-lg border border-slate-200 dark:border-slate-600 focus:outline-none focus:ring-1 focus:ring-sky-500 dark:text-slate-100 w-full sm:w-44"
                  />
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-2 text-xs max-h-52 overflow-y-auto p-1 scrollbar-thin">
                  {filteredDistricts.map((place, idx) => {
                    const isSelected = displayPlace === place.place;
                    return (
                      <button
                        key={idx}
                        onClick={() => setSelectedDistrict(place.place)}
                        className={`p-2 rounded-xl flex justify-between items-center text-left border transition ${
                          isSelected
                            ? "bg-sky-600 text-white border-sky-600 shadow-sm font-bold ring-2 ring-sky-300 dark:ring-sky-700"
                            : "bg-slate-50 dark:bg-slate-700/50 border-slate-100 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300"
                        }`}
                      >
                        <span className="truncate mr-1">{place.place}</span>
                        <span className={`shrink-0 ${isSelected ? "text-white font-black" : "font-bold text-slate-800 dark:text-slate-100"}`}>
                          {formatNumberDecimal(place.value)}°C
                        </span>
                      </button>
                    );
                  })}
                </div>
              </div>

              {forecast.length > 0 && (
                <div className="mt-5 pt-4 border-t border-slate-100 dark:border-slate-700">
                  <h3 className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">未來九天天氣預報</h3>
                  <div className="flex gap-2.5 overflow-x-auto pb-2 scrollbar-thin">
                    {forecast.slice(0, 9).map((f, idx) => (
                      <div key={idx} className="min-w-[105px] flex-1 p-3 rounded-xl bg-slate-50 dark:bg-slate-700/30 text-center border border-slate-100 dark:border-slate-700/50 shrink-0">
                        <div className="text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">
                          {f.forecastDate ? `${f.forecastDate.substring(4,6)}/${f.forecastDate.substring(6,8)}` : ''} ({f.week?.replace('星期', '週')})
                        </div>
                        <div className="text-sm font-bold text-slate-800 dark:text-slate-100 my-1">
                          {formatNumberDecimal(f.forecastMintemp?.value)}° - {formatNumberDecimal(f.forecastMaxtemp?.value)}°C
                        </div>
                        <div className="text-[11px] text-slate-500 dark:text-slate-400 line-clamp-1" title={f.forecastWeather}>
                          {f.forecastWeather}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </>
          )}
        </div>
      );
    }

    function HospitalSection() {
      const [hospitals, setHospitals] = useState([]);
      const [loading, setLoading] = useState(true);
      const [updateTime, setUpdateTime] = useState("");
      const [search, setSearch] = useState("");
      const [regionFilter, setRegionFilter] = useState("ALL");

      const fetchHAData = useCallback(async () => {
        setLoading(true);
        try {
          const res = await fetchWithProxy("https://www.ha.org.hk/opendata/aed/aedwtdata2-tc.json");
          if (res && (res.hospData || res.waitTime)) {
            const list = res.hospData || res.waitTime;
            setHospitals(list);
            setUpdateTime(res.updateTime || new Date().toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit' }));
          } else {
            setHospitals([
  // Hong Kong Island
  { hospNameName: "東區尤德夫人那打素醫院", topWait: "超過 4 小時" },
  { hospNameName: "瑪麗醫院", topWait: "超過 3 小時" },
  { hospNameName: "律敦治醫院", topWait: "超過 2 小時" },
  { hospNameName: "長洲醫院", topWait: "第一時間" },

    function BusSection({ onAddFavorite }) {
      const [company, setCompany] = useState("KMB");
      const [route, setRoute] = useState("1A");
      const [loading, setLoading] = useState(false);
      const [stops, setStops] = useState([]);
      const [selectedStop, setSelectedStop] = useState(null);
      const [etaList, setEtaList] = useState([]);

      const searchRoute = useCallback(async () => {
        if (!route.trim()) return;
        setLoading(true);
        setStops([]);
        setSelectedStop(null);
        setEtaList([]);

        try {
          if (company === "KMB") {
            const res = await fetchWithProxy(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${route.trim().toUpperCase()}/outbound/1`);
            if (res && res.data) {
              const stopDetails = await Promise.all(
                res.data.slice(0, 15).map(async (item) => {
                  const s = await fetchWithProxy(`https://data.etabus.gov.hk/v1/transport/kmb/stop/${item.stop}`);
                  return {
                    stopId: item.stop,
                    seq: item.seq,
                    name: s?.data?.name_tc || item.stop
                  };
                })
              );
              setStops(stopDetails);
            }
          } else {
            const res = await fetchWithProxy(`https://data.etabus.gov.hk/v1/transport/citybus-nwfb/route-stop/ctb/${route.trim().toUpperCase()}/outbound`);
            if (res && res.data) {
              setStops(res.data.slice(0, 15).map(s => ({ stopId: s.stop, seq: s.seq, name: `巴士站 #${s.stop}` })));
            }
          }
        } catch (e) {
          console.error("Bus route error", e);
        } finally {
          setLoading(false);
        }
      }, [company, route]);

      const fetchETA = async (stop) => {
        setSelectedStop(stop);
        setEtaList([]);
        try {
          const url = company === "KMB"
            ? `https://data.etabus.gov.hk/v1/transport/kmb/eta/${stop.stopId}/${route.trim().toUpperCase()}/1`
            : `https://data.etabus.gov.hk/v1/transport/citybus-nwfb/eta/ctb/${stop.stopId}/${route.trim().toUpperCase()}`;

          const res = await fetchWithProxy(url);
          if (res && res.data) {
            setEtaList(res.data.slice(0, 3));
          }
        } catch (e) {
          console.error("Bus ETA error", e);
        }
      };

      useEffect(() => {
        searchRoute();
      }, []);

      return (
        <div className="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-slate-700">

              className={`px-3 py-1.5 rounded-xl font-bold text-xs transition ${company === 'KMB' ? 'bg-red-600 text-white shadow-sm' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300'}`}
            >
              九巴 (KMB)

            <button
              onClick={() => setCompany("CTB")}
              className={`px-3 py-1.5 rounded-xl font-bold text-xs transition ${company === 'CTB' ? 'bg-blue-600 text-white shadow-sm' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300'}`}

          </div>

          <div className="flex gap-2 mb-4">
            <input

              onChange={(e) => setRoute(e.target.value)}
              placeholder="輸入路線 (如 1A, 290A, 102)..."
              className="flex-1 px-3 py-2 text-xs bg-slate-50 dark:bg-slate-700/50 rounded-xl border border-slate-200 dark:border-slate-600 focus:outline-none focus:ring-2 focus:ring-red-500 dark:text-slate-100"
            />
            <button

            >
              {loading ? <i className="fa-solid fa-spinner fa-spin"></i> : "搜尋車站"}
            </button>
          </div>

          {stops.length > 0 && (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <h4 className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">沿途車站</h4>
                <div className="space-y-1.5 max-h-60 overflow-y-auto pr-1 scrollbar-thin">
                  {stops.map((s, idx) => (
                    <button
                      key={idx}

                      className={`w-full text-left p-2.5 rounded-xl border text-xs flex justify-between items-center transition ${selectedStop?.stopId === s.stopId ? 'bg-red-50 dark:bg-red-950/40 border-red-300 text-red-600 dark:text-red-400 font-bold' : 'bg-slate-50 dark:bg-slate-700/30 border-slate-100 dark:border-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-100'}`}
                    >

                    </button>

                </div>
              </div>

              <div>

                      <div>
                        <div className="font-bold text-sm text-slate-800 dark:text-slate-100">{selectedStop.name}</div>
                        <div className="text-xs text-slate-400">{company} 路線 {route}</div>
                      </div>
                      <button
                        onClick={() => onAddFavorite({ type: 'BUS', company, route, stopName: selectedStop.name, stopId: selectedStop.stopId })}
                        className="p-2 rounded-xl bg-amber-500/10 text-amber-500 hover:bg-amber-500 hover:text-white transition text-xs font-bold flex items-center gap-1"
                      >
                        <i className="fa-solid fa-star"></i>加入最愛
                      </button>
                    </div>

                    <div className="space-y-2">
                      {etaList.length > 0 ? etaList.map((eta, i) => (
                        <div key={i} className="p-2.5 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 flex justify-between items-center text-xs">
                          <span className="text-slate-500">往 {eta.dest_tc || "目的地"}</span>
                          <span className="font-extrabold text-red-600 dark:text-red-400 text-sm">
                            {eta.eta ? `${Math.max(0, Math.round((new Date(eta.eta) - new Date()) / 60000))} 分鐘` : "即將到達"}
                          </span>

                      )}
                    </div>
                  </div>
                ) : (
                  <div className="p-6 text-center text-slate-400 text-xs border border-dashed border-slate-200 dark:border-slate-700 rounded-2xl">
                    請點擊左側車站查看實時到站時間
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );

              <div key={index} className="p-3.5 bg-slate-50 dark:bg-slate-700/30 rounded-xl border border-slate-200 dark:border-slate-700 flex justify-between items-start">
                <div>
                  <div className="flex items-center gap-2 mb-1">
                    <span className={`px-2 py-0.5 rounded text-[10px] font-black text-white ${fav.type === 'BUS' ? 'bg-red-600' : fav.type === 'MTR' ? 'bg-purple-600' : 'bg-emerald-600'}`}>
                      {fav.type}
                    </span>
                    <span className="font-bold text-slate-800 dark:text-slate-100 text-xs">
                      {fav.type === 'BUS' ? `${fav.company} ${fav.route}` : fav.type === 'MTR' ? fav.lineName : `${fav.region} ${fav.route}`}
                    </span>
                  </div>
                  <div className="text-xs text-slate-500 dark:text-slate-300 font-medium">{fav.stopName || fav.stationName}</div>
                </div>

                <button
                  onClick={() => onRemoveFavorite(index)}
                  className="text-slate-400 hover:text-rose-500 p-1 text-xs transition"
                  title="移除最愛"
                >
                  <i className="fa-solid fa-trash-can"></i>
                </button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function App() {
      const [activeTab, setActiveTab] = useState("weather");
      const [fontSizeLarge, setFontSizeLarge] = useState(false);
      const [favorites, setFavorites] = useState(() => {
        try {
          const saved = localStorage.getItem("hk_info_favs");
          return saved ? JSON.parse(saved) : [];
        } catch (e) {
          return [];
        }
      });
      const [toast, setToast] = useState("");

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(""), 2500);
      };

      const handleAddFavorite = (item) => {
        const updated = [...favorites, item];
        setFavorites(updated);
        try {
          localStorage.setItem("hk_info_favs", JSON.stringify(updated));
        } catch (e) {}
        showToast("已成功加入「我的最愛」！");
      };

      const handleRemoveFavorite = (index) => {
        const updated = favorites.filter((_, i) => i !== index);
        setFavorites(updated);
        try {
          localStorage.setItem("hk_info_favs", JSON.stringify(updated));
        } catch (e) {}
        showToast("已移除「我的最愛」。");
      };

      return (
        <div className={`max-w-5xl mx-auto p-3 sm:p-5 ${fontSizeLarge ? 'large-font-mode' : ''}`}>
          {/* Toast Notification */}
          {toast && (
            <div className="fixed bottom-5 right-5 z-50 bg-slate-900 text-white dark:bg-white dark:text-slate-900 px-4 py-2.5 rounded-2xl shadow-xl text-xs font-bold flex items-center gap-2 animate-bounce">
              <i className="fa-solid fa-circle-check text-emerald-400"></i>
              <span>{toast}</span>
            </div>
          )}

          {/* Header Bar */}
          <header className="flex flex-col sm:flex-row items-center justify-between gap-4 mb-5 bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-sky-600 text-white flex items-center justify-center font-black text-xl shadow-md shrink-0">
                港
              </div>
              <div>
                <h1 className="font-extrabold text-slate-900 dark:text-white text-base sm:text-lg leading-tight">
                  香港實時資訊綜合平台
                </h1>
                <p className="text-xs text-slate-400">天氣 ‧ 巴士 ‧ 港鐵 ‧ 小巴 ‧ 急症室實時 Open Data</p>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <button
                onClick={() => setFontSizeLarge(!fontSizeLarge)}
                className={`px-3 py-1.5 rounded-xl text-xs font-bold border transition shrink-0 ${fontSizeLarge ? 'bg-sky-600 text-white border-sky-600' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-600'}`}
              >
                <i className="fa-solid fa-font mr-1"></i>
                {fontSizeLarge ? "標準字體" : "放大字體 (30px)"}
              </button>
            </div>
          </header>

          {/* Tab Navigation */}
          <nav className="flex gap-1.5 overflow-x-auto pb-2 mb-5 scrollbar-thin">
            {[
              { id: 'weather', name: '天氣預報', icon: 'fa-cloud-sun' },
              { id: 'bus', name: '巴士到站', icon: 'fa-bus' },
              { id: 'mtr', name: '港鐵班次', icon: 'fa-train-subway' },
              { id: 'gmb', name: '專線小巴', icon: 'fa-van-shuttle' },
              { id: 'ha', name: '急症室等候', icon: 'fa-hospital' },
              { id: 'fav', name: `我的最愛 (${favorites.length})`, icon: 'fa-star' }
            ].map(tab => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                className={`px-4 py-2.5 rounded-xl font-bold text-xs whitespace-nowrap transition flex items-center gap-2 border ${activeTab === tab.id ? 'bg-sky-600 text-white border-sky-600 shadow-sm' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700'}`}
              >
                <i className={`fa-solid ${tab.icon}`}></i>
                <span>{tab.name}</span>
              </button>
            ))}
          </nav>

          {/* Active Tab View */}
          <main className="space-y-5">
            {activeTab === 'weather' && <WeatherSection />}
            {activeTab === 'bus' && <BusSection onAddFavorite={handleAddFavorite} />}
            {activeTab === 'mtr' && <MTRSection onAddFavorite={handleAddFavorite} />}
            {activeTab === 'gmb' && <GMBSection onAddFavorite={handleAddFavorite} />}
            {activeTab === 'ha' && <HospitalSection />}
            {activeTab === 'fav' && <FavoritesSection favorites={favorites} onRemoveFavorite={handleRemoveFavorite} />}
          </main>

          {/* Footer */}
          <footer className="mt-8 text-center text-xs text-slate-400 pb-6">
            <p>數據來源：香港政府資料一線通 (data.gov.hk) / 香港天文台 / 醫院管理局</p>
          </footer>
        </div>
      );
    }

    window.onload = function() {
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    };
  </script>
</body>
</html>
