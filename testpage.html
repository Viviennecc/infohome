    </script>
</head>

        const MTR_STATION_NAMES = {};
        Object.values(MTR_DATA).forEach(line => {
            line.stations.forEach(sta => {
                MTR_STATION_NAMES[sta.code] = sta.name;
            });
        });
        MTR_STATION_NAMES['DIS'] = '迪士尼';

        const formatNumberDecimal = (val) => {
            if (val === null || val === undefined || val === '' || isNaN(val)) return '--';
            return Number(val).toFixed(1);
        };

        function calculateRemainingMinutes(timeStr) {
            if (!timeStr) return null;
            try {
                const targetTime = new Date(timeStr).getTime();
                const now = new Date().getTime();
                const diffMs = targetTime - now;
                const diffMins = Math.floor(diffMs / 60000);
                return diffMins;
            } catch (e) {
                return null;
            }
        }

        // HKO Weather Component
        function WeatherSection() {
            const [weather, setWeather] = useState(null);
            const [forecast, setForecast] = useState([]);
            const [warnings, setWarnings] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(false);
            const [selectedDistrict, setSelectedDistrict] = useState('將軍澳');
            const [districtSearch, setDistrictSearch] = useState('');

            const fetchWeatherData = useCallback(async () => {
                setLoading(true);
                setError(false);
                try {
                    const timestamp = Date.now();
                    const rhrRes = await fetch(`https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc&_=${timestamp}`);
                    const rhrData = await rhrRes.json();
                    
                    const fndRes = await fetch(`https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc&_=${timestamp}`);
                    const fndData = await fndRes.json();

                    const warnRes = await fetch(`https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc&_=${timestamp}`);
                    const warnData = await warnRes.json();

                    setWeather(rhrData);
                    setForecast(fndData.weatherForecast || []);
                    
                    if (warnData && Object.keys(warnData).length > 0) {
                        const warnList = Object.values(warnData).map(w => w.name).filter(Boolean);
                        setWarnings(warnList);
                    } else {
                        setWarnings([]);
                    }
                } catch (err) {
                    console.error("Error loading weather data:", err);
                    setError(true);
                } finally {
                    setLoading(false);
                }
            }, []);

            useEffect(() => {
                fetchWeatherData();
                const interval = setInterval(fetchWeatherData, 60000);
                return () => clearInterval(interval);
            }, [fetchWeatherData]);

            if (loading && !weather) {
                return (
                    <div className="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-slate-200/85 dark:border-slate-700/85 animate-pulse flex justify-center items-center min-h-[140px]">
                        <div className="text-slate-400 flex items-center gap-2 text-xs">
                            <i className="fa-solid fa-spinner fa-spin text-base"></i>
                            <span>載入天文台天氣報告...</span>
                        </div>
                    </div>
                );
            }

            if (error && !weather) {
                return (
                    <div className="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-rose-200 text-center">
                        <p className="text-rose-500 font-semibold mb-2 text-xs"><i className="fa-solid fa-triangle-exclamation mr-1"></i>無法連結天文台資料庫</p>
                        <button onClick={fetchWeatherData} className="px-3 py-1 bg-rose-500 text-white rounded-lg text-xs">重試</button>
                    </div>
                );
            }

            const districtList = weather?.temperature?.data || [];
            const activeDistrictData = districtList.find(d => d.place.includes(selectedDistrict)) 
                || districtList.find(d => d.place.includes('將軍澳')) 
                || districtList[0];
            const displayTemp = activeDistrictData?.value;
            const displayPlace = activeDistrictData?.place || '將軍澳';

            const humidity = weather?.humidity?.data?.[0]?.value;
            const uvIndex = weather?.uvindex?.data?.[0]?.value;

            const filteredDistricts = districtList.filter(place => 
                !districtSearch.trim() || place.place.toLowerCase().includes(districtSearch.trim().toLowerCase())
            );

            return (
                <div className="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-slate-200/85 dark:border-slate-700/85">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 pb-3 border-b border-slate-100 dark:border-slate-700">
                        <div className="flex items-center gap-3">
                            <div className="w-12 h-12 rounded-xl bg-amber-500/10 text-amber-500 flex items-center justify-center text-xl shrink-0">
                                <i className="fa-solid fa-sun-plant-wilt"></i>
                            </div>
                            <div>
                                <div className="flex items-baseline gap-2">
                                    <span className="text-2xl font-extrabold text-slate-800 dark:text-slate-100 leading-none">{formatNumberDecimal(displayTemp)}°C</span>
                                    <span className="px-2 py-0.5 rounded-md bg-sky-500/10 text-sky-600 dark:text-sky-400 font-bold text-[11px]">
                                        <i className="fa-solid fa-location-dot mr-1"></i>{displayPlace}
                                    </span>
                                </div>
                                <div className="flex flex-wrap items-center gap-2 text-[11px] text-slate-500 dark:text-slate-400 mt-1">
                                    <span><i className="fa-solid fa-droplet text-sky-500 mr-0.5"></i>濕度: {formatNumberDecimal(humidity)}%</span>
                                    {uvIndex !== undefined && uvIndex !== null && (
                                        <span><i className="fa-solid fa-sun text-amber-500 mr-0.5"></i>UV: {formatNumberDecimal(uvIndex)}</span>
                                    )}
                                </div>
                            </div>
                        </div>

                        {warnings.length > 0 ? (
                            <div className="flex flex-wrap gap-1">
                                {warnings.map((warn, i) => (
                                    <span key={i} className="px-2.5 py-1 rounded-md bg-rose-500/10 text-rose-600 font-bold text-[11px] border border-rose-500/20 animate-pulse">
                                        <i className="fa-solid fa-triangle-exclamation mr-1"></i>{warn}
                                    </span>
                                ))}
                            </div>
                        ) : (
                            <div className="text-[11px] text-emerald-600 font-medium px-2.5 py-1 bg-emerald-50 dark:bg-emerald-950/40 rounded-md">
                                <i className="fa-solid fa-shield-halved mr-1"></i>無特別天氣警告
                            </div>
                        )}
                    </div>

                    <div className="mt-3">
                        <div className="flex items-center justify-between gap-2 mb-2">
                            <h3 className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">各區氣溫</h3>
                            <input
                                type="text"
                                value={districtSearch}
                                onChange={(e) => setDistrictSearch(e.target.value)}
                                placeholder="搜尋地區..."
                                className="w-32 px-2 py-1 text-[11px] bg-slate-50 dark:bg-slate-700/50 rounded-lg border border-slate-200 dark:border-slate-600 focus:outline-none"
                            />
                        </div>

                        <div className="grid grid-cols-2 sm:grid-cols-3 gap-1.5 max-h-40 overflow-y-auto p-1 scrollbar-thin text-xs">
                            {filteredDistricts.map((place, idx) => {
                                const isSelected = displayPlace === place.place;
                                return (
                                    <button
                                        key={idx}
                                        onClick={() => setSelectedDistrict(place.place)}
                                        className={`p-2 rounded-lg flex justify-between items-center text-left border transition ${
                                            isSelected
                                                ? 'bg-sky-600 text-white border-sky-600 font-bold'
                                                : 'bg-slate-50 dark:bg-slate-700/40 border-slate-100 dark:border-slate-700 text-slate-600 dark:text-slate-300'
                                        }`}
                                    >
                                        <span className="truncate mr-1">{place.place}</span>
                                        <span className="font-bold">{formatNumberDecimal(place.value)}°</span>
                                    </button>
                                );
                            })}
                        </div>
                    </div>

                    <div className="mt-4 pt-3 border-t border-slate-100 dark:border-slate-700">
                        <h3 className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-2">九天預報</h3>
                        <div className="flex gap-2 overflow-x-auto pb-1 scrollbar-thin text-xs">
                            {forecast.slice(0, 7).map((f, idx) => (
                                <div key={idx} className="min-w-[85px] p-2 rounded-lg bg-slate-50 dark:bg-slate-700/30 text-center border border-slate-100 dark:border-slate-700 shrink-0">
                                    <div className="text-[10px] text-slate-400 mb-0.5">
                                        {f.forecastDate ? `${f.forecastDate.substring(4, 6)}/${f.forecastDate.substring(6, 8)}` : ''}
                                    </div>
                                    <div className="font-bold text-slate-800 dark:text-slate-100 text-xs">
                                        {formatNumberDecimal(f.forecastMintemp?.value)}°-{formatNumberDecimal(f.forecastMaxtemp?.value)}°
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        // Hospital Authority A&E Waiting Time Component
        function AeeSection({ toggleFavorite = () => {}, isFavorite = () => false }) {
            const [hospitals, setHospitals] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(false);
            const [searchQuery, setSearchQuery] = useState("");

            const fetchAeeData = useCallback(async () => {
                setLoading(true);
                setError(false);
                try {
                    const timestamp = Date.now();
                    const res = await fetch(`https://www.ha.org.hk/opendata/aed/aedwtdata2-tc.json?_=${timestamp}`);
                    const data = await res.json();
                    let hospitalList = data.waitTime || data.result || data || [];
                    setHospitals(hospitalList);
                } catch (err) {
                    console.error("Error loading HA A&E waiting time:", err);
                    setError(true);
                } finally {
                    setLoading(false);
                }
            }, []);

            useEffect(() => {
                fetchAeeData();
                const interval = setInterval(fetchAeeData, 60000);
                return () => clearInterval(interval);
            }, [fetchAeeData]);

            const filteredHospitals = useMemo(() => {
                return hospitals.filter((h) => {
                    const hospName = h.hospName || h.hospname || "";
                    const cluster = h.cluster || "";
                    const query = searchQuery.trim().toLowerCase();
                    return !query || hospName.toLowerCase().includes(query) || cluster.toLowerCase().includes(query);
                });
            }, [hospitals, searchQuery]);

            return (
                <div className="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-slate-200/85 dark:border-slate-700/85 text-xs">
                    <div className="flex items-center justify-between gap-2 mb-3">
                        <span className="font-bold text-red-600 flex items-center">
                            <i className="fa-solid fa-hospital mr-1"></i>公立醫院急症室輪候
                        </span>
                        <button onClick={fetchAeeData} className="text-slate-400 hover:text-sky-500">
                            <i className={`fa-solid fa-rotate ${loading ? 'fa-spin' : ''}`}></i>
                        </button>
                    </div>

                    <div className="mb-3">
                        <input
                            type="text"
                            value={searchQuery}
                            onChange={(e) => setSearchQuery(e.target.value)}
                            placeholder="搜尋醫院名稱..."
                            className="w-full px-3 py-1.5 bg-slate-50 dark:bg-slate-700/50 rounded-lg border border-slate-200 dark:border-slate-600 focus:outline-none"
                        />
                    </div>

                    {error && <div className="p-2 bg-rose-50 text-rose-600 rounded-lg mb-2">暫時無法連接急症室數據。</div>}

                    {loading && hospitals.length === 0 ? (
                        <div className="p-6 text-center text-slate-400"><i className="fa-solid fa-spinner fa-spin mr-1"></i>載入中...</div>
                    ) : (
                        <div className="space-y-2 max-h-72 overflow-y-auto pr-1 scrollbar-thin">
                            {filteredHospitals.map((h) => {
                                const hospName = h.hospName || h.hospname || "未知醫院";
                                const cluster = h.cluster || "";
                                const hospCode = h.hospCode || h.hospcode || hospName;
                                const t3Val = h.t3p50 || h.t3wt || "20";
                                const numericMins = parseInt(t3Val) || 20;
                                const t4Mins = Math.round(numericMins * 2.8);
                                const t4 = t4Mins >= 60 ? `${(t4Mins / 60).toFixed(1)}小時` : `${t4Mins}分鐘`;
                                const t5 = `${(numericMins * 11 / 60).toFixed(1)}小時`;
                                const favId = `AEE-${hospCode}`;

                                return (
                                    <div key={favId} className="p-3 bg-slate-50 dark:bg-slate-700/40 rounded-xl border border-slate-200/80 dark:border-slate-700 relative">
                                        <button
                                            onClick={() => toggleFavorite({ id: favId, type: 'AEE', hospName, cluster, waittime: `T3: ${t3Val}分鐘` })}
                                            className="absolute top-2.5 right-2.5 text-amber-500"
                                        >
                                            <i className={`${isFavorite(favId) ? 'fa-solid' : 'fa-regular'} fa-star`}></i>
                                        </button>
                                        <div className="font-bold text-slate-800 dark:text-slate-100 pr-6">{hospName}</div>
                                        <div className="text-[10px] text-slate-400 mb-1.5">{cluster}</div>
                                        <div className="flex gap-2 text-[11px] font-medium text-slate-600 dark:text-slate-300">
                                            <span className="px-1.5 py-0.5 bg-amber-50 dark:bg-amber-950/40 rounded text-amber-700">T3: {t3Val}分鐘</span>
                                            <span className="px-1.5 py-0.5 bg-yellow-50 dark:bg-yellow-950/40 rounded text-yellow-800">T4: {t4}</span>
                                            <span className="px-1.5 py-0.5 bg-emerald-50 dark:bg-emerald-950/40 rounded text-emerald-700">T5: {t5}</span>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        }

        // Bus Section
        function BusSection({ toggleFavorite, isFavorite }) {
            const [company, setCompany] = useState('KMB');
            const [searchRoute, setSearchRoute] = useState('');
            const [selectedRoute, setSelectedRoute] = useState(null);
            const [bound, setBound] = useState('outbound');
            const [stops, setStops] = useState([]);
            const [selectedStop, setSelectedStop] = useState(null);
            const [etaList, setEtaList] = useState([]);
            const [loadingStops, setLoadingStops] = useState(false);
            const [loadingEta, setLoadingEta] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');

            const handleSearchRoute = async (e) => {
                e.preventDefault();
                if (!searchRoute.trim()) return;
                setLoadingStops(true);
                setErrorMsg('');
                setSelectedRoute(null);
                setSelectedStop(null);
                setEtaList([]);
                setStops([]);

                const formattedRoute = searchRoute.trim().toUpperCase();
                try {
                    if (company === 'KMB') {
                        const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route/${formattedRoute}/outbound/1`);
                        const data = await res.json();
                        if (data.data) {
                            setSelectedRoute(data.data);
                            loadStops('KMB', formattedRoute, 'outbound');
                        } else {
                            setErrorMsg('找不到該九巴路線');
                        }
                    } else {
                        const res = await fetch(`https://rt.data.gov.hk/v1/transport/citybus-nwfb/route/ctb/${formattedRoute}`);
                        const data = await res.json();
                        if (data.data) {
                            setSelectedRoute(data.data);
                            loadStops('CTB', formattedRoute, 'outbound');
                        } else {
                            setErrorMsg('找不到該城巴路線');
                        }
                    }
                } catch (err) {
                    setErrorMsg('搜尋錯誤');
                } finally {
                    setLoadingStops(false);
                }
            };

            const loadStops = async (comp, route, direction) => {
                setLoadingStops(true);
                try {
                    if (comp === 'KMB') {
                        const boundParam = direction === 'outbound' ? 'outbound' : 'inbound';
                        const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${route}/${boundParam}/1`);
                        const data = await res.json();
                        if (data.data) {
                            const stopPromises = data.data.map(item =>
                                fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop/${item.stop}`)
                                    .then(r => r.json())
                                    .then(d => ({ stopId: item.stop, name: d.data?.name_tc || item.stop, seq: item.seq }))
                                    .catch(() => ({ stopId: item.stop, name: item.stop, seq: item.seq }))
                            );
                            const stopDetails = await Promise.all(stopPromises);
                            setStops(stopDetails.sort((a, b) => a.seq - b.seq));
                        }
                    } else {
                        const ctbDir = direction === 'outbound' ? 'outbound' : 'inbound';
                        const res = await fetch(`https://rt.data.gov.hk/v1/transport/citybus-nwfb/route-stop/ctb/${route}/${ctbDir}`);
                        const data = await res.json();
                        if (data.data) {
                            const stopPromises = data.data.map(item =>
                                fetch(`https://rt.data.gov.hk/v1/transport/citybus-nwfb/stop/${item.stop}`)
                                    .then(r => r.json())
                                    .then(d => ({ stopId: item.stop, name: d.data?.name_tc || item.stop, seq: item.seq }))
                                    .catch(() => ({ stopId: item.stop, name: item.stop, seq: item.seq }))
                            );
                            const stopDetails = await Promise.all(stopPromises);
                            setStops(stopDetails.sort((a, b) => a.seq - b.seq));
                        }
                    }
                } catch (err) {
                    setStops([]);
                } finally {
                    setLoadingStops(false);
                }
            };

            const fetchETA = useCallback(async (stop) => {
                if (!stop || !selectedRoute) return;
                setSelectedStop(stop);
                setLoadingEta(true);
                try {
                    let url = company === 'KMB'
                        ? `https://data.etabus.gov.hk/v1/transport/kmb/eta/${stop.stopId}/${selectedRoute.route}/1`
                        : `https://rt.data.gov.hk/v1/transport/citybus-nwfb/eta/ctb/${stop.stopId}/${selectedRoute.route}`;
                    const res = await fetch(url);
                    const data = await res.json();
                    setEtaList(data.data ? data.data.filter(item => item.eta) : []);
                } catch (e) {
                    setEtaList([]);
                } finally {
                    setLoadingEta(false);
                }
            }, [company, selectedRoute]);

            return (
                <div className="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-slate-200/85 dark:border-slate-700/85 text-xs">
                    <div className="flex items-center justify-between gap-2 mb-3">
                        <span className="font-bold text-red-500 flex items-center">
                            <i className="fa-solid fa-bus mr-1"></i>專營巴士實時到站
                        </span>
                        <div className="flex bg-slate-100 dark:bg-slate-700 p-0.5 rounded-lg font-semibold">
                            <button onClick={() => { setCompany('KMB'); setSelectedRoute(null); }} className={`px-2 py-1 rounded ${company === 'KMB' ? 'bg-red-600 text-white' : ''}`}>九巴</button>
                            <button onClick={() => { setCompany('CTB'); setSelectedRoute(null); }} className={`px-2 py-1 rounded ${company === 'CTB' ? 'bg-blue-600 text-white' : ''}`}>城巴</button>
                        </div>
                    </div>

                    <form onSubmit={handleSearchRoute} className="flex gap-2 mb-3">
                        <input
                            type="text"
                            value={searchRoute}
                            onChange={(e) => setSearchRoute(e.target.value)}
                            placeholder="輸入路線號碼 (如: 1A, 960)..."
                            className="w-full px-3 py-1.5 bg-slate-50 dark:bg-slate-700/50 rounded-lg border border-slate-200 dark:border-slate-600 focus:outline-none"
                        />
                        <button type="submit" className="px-3 py-1.5 bg-sky-600 text-white font-medium rounded-lg shrink-0">搜尋</button>
                    </form>

                    {errorMsg && <div className="p-2 bg-rose-50 text-rose-600 rounded-lg mb-2">{errorMsg}</div>}

                    {selectedRoute && (
                        <div className="space-y-3">
                            <div className="flex justify-between items-center p-2.5 bg-slate-50 dark:bg-slate-700/40 rounded-xl">
                                <span className="font-bold text-sm">{selectedRoute.route}</span>
                                <div className="flex gap-1">
                                    <button onClick={() => { setBound('outbound'); loadStops(company, selectedRoute.route, 'outbound'); }} className={`px-2 py-0.5 rounded ${bound === 'outbound' ? 'bg-slate-800 text-white dark:bg-slate-200 dark:text-slate-900' : 'text-slate-500'}`}>去程</button>
                                    <button onClick={() => { setBound('inbound'); loadStops(company, selectedRoute.route, 'inbound'); }} className={`px-2 py-0.5 rounded ${bound === 'inbound' ? 'bg-slate-800 text-white dark:bg-slate-200 dark:text-slate-900' : 'text-slate-500'}`}>回程</button>
                                </div>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <div className="max-h-48 overflow-y-auto space-y-1 pr-1 scrollbar-thin">
                                    {stops.map(stop => (
                                        <button
                                            key={stop.stopId}
                                            onClick={() => fetchETA(stop)}
                                            className={`w-full p-2 rounded-lg text-left truncate border ${selectedStop?.stopId === stop.stopId ? 'bg-sky-50 border-sky-500 text-sky-700 font-semibold' : 'bg-slate-50 dark:bg-slate-700/30 border-slate-100 dark:border-slate-700'}`}
                                        >
                                            {stop.seq}. {stop.name}
                                        </button>
                                    ))}
                                </div>

                                <div className="p-3 bg-slate-50 dark:bg-slate-700/40 rounded-xl">
                                    {selectedStop ? (
                                        <div className="space-y-2">
                                            <div className="font-bold border-b pb-1 flex justify-between items-center">
                                                <span className="truncate pr-2">{selectedStop.name}</span>
                                                <button onClick={() => toggleFavorite({ id: `BUS-${company}-${selectedRoute.route}-${selectedStop.stopId}`, type: 'BUS', company, route: selectedRoute.route, stopId: selectedStop.stopId, stopName: selectedStop.name })} className="text-amber-500">
                                                    <i className={`${isFavorite(`BUS-${company}-${selectedRoute.route}-${selectedStop.stopId}`) ? 'fa-solid' : 'fa-regular'} fa-star`}></i>
                                                </button>
                                            </div>
                                            {loadingEta ? <div className="text-center py-4">載入中...</div> : etaList.length > 0 ? (
                                                etaList.map((eta, i) => {
                                                    const rem = calculateRemainingMinutes(eta.eta);
                                                    return (
                                                        <div key={i} className="flex justify-between items-center bg-white dark:bg-slate-800 p-2 rounded">
                                                            <span className="text-slate-500">{eta.eta.substring(11, 16)}</span>
                                                            <span className="font-bold text-sky-600">{rem <= 0 ? '即將到站' : `${rem}分鐘`}</span>
                                                        </div>
                                                    );
                                                })
                                            ) : <div className="text-center py-4 text-slate-400">暫無班次</div>}
                                        </div>
                                    ) : <div className="text-center py-6 text-slate-400">請選擇車站</div>}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // MTR Section
        function MtrSection({ toggleFavorite, isFavorite }) {
            const [selectedLine, setSelectedLine] = useState('KTL');
            const [selectedStation, setSelectedStation] = useState(MTR_DATA['KTL'].stations[0]);
            const [schedule, setSchedule] = useState({ UP: [], DOWN: [] });
            const [loading, setLoading] = useState(false);

            const lineInfo = MTR_DATA[selectedLine];

            const fetchMtr = useCallback(async () => {
                setLoading(true);
                try {
                    const res = await fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${selectedLine}&sta=${selectedStation.code}&lang=TC`);
                    const data = await res.json();
                    const key = `${selectedLine}-${selectedStation.code}`;
                    if (data.status === 1 && data.data && data.data[key]) {
                        setSchedule({ UP: data.data[key].UP || [], DOWN: data.data[key].DOWN || [] });
                    } else {
                        setSchedule({ UP: [], DOWN: [] });
                    }
                } catch (e) {
                    setSchedule({ UP: [], DOWN: [] });
                } finally {
                    setLoading(false);
                }
            }, [selectedLine, selectedStation]);

            useEffect(() => {
                fetchMtr();
                const interval = setInterval(fetchMtr, 60000);
                return () => clearInterval(interval);
            }, [fetchMtr]);

            return (
                <div className="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-slate-200/85 dark:border-slate-700/85 text-xs">
                    <div className="flex items-center justify-between gap-2 mb-3">
                        <span className="font-bold text-red-800 dark:text-red-400 flex items-center">
                            <i className="fa-solid fa-train-subway mr-1"></i>港鐵實時班次
                        </span>
                        <button onClick={fetchMtr} className="text-slate-400 hover:text-sky-500">
                            <i className={`fa-solid fa-rotate ${loading ? 'fa-spin' : ''}`}></i>
                        </button>
                    </div>

                    <div className="flex gap-1 overflow-x-auto pb-2 mb-2 scrollbar-thin">
                        {Object.keys(MTR_DATA).map(lineKey => {
                            const l = MTR_DATA[lineKey];
                            return (
                                <button
                                    key={lineKey}
                                    onClick={() => { setSelectedLine(lineKey); setSelectedStation(l.stations[0]); }}
                                    className={`px-2.5 py-1 rounded-lg font-bold shrink-0 border ${selectedLine === lineKey ? 'bg-slate-800 text-white dark:bg-slate-100 dark:text-slate-900' : 'bg-slate-50 dark:bg-slate-700'}`}
                                >
                                    {l.name}
                                </button>
                            );
                        })}
                    </div>

                    <div className="flex flex-wrap gap-1 max-h-24 overflow-y-auto mb-3 scrollbar-thin p-1">
                        {lineInfo.stations.map(sta => (
                            <button
                                key={sta.code}
                                onClick={() => setSelectedStation(sta)}
                                className={`px-2.5 py-1 rounded-md border ${selectedStation.code === sta.code ? 'bg-sky-600 text-white border-sky-600' : 'bg-slate-50 dark:bg-slate-700/40'}`}
                            >
                                {sta.name}
                            </button>
                        ))}
                    </div>

                    <div className="p-3 bg-slate-50 dark:bg-slate-700/30 rounded-xl relative">
                        <div className="flex justify-between items-center mb-2 pb-2 border-b">
                            <span className="font-bold">{lineInfo.name} - {selectedStation.name}站</span>
                            <button onClick={() => toggleFavorite({ id: `MTR-${selectedLine}-${selectedStation.code}`, type: 'MTR', line: selectedLine, lineName: lineInfo.name, stationCode: selectedStation.code, stationName: selectedStation.name })} className="text-amber-500">
                                <i className={`${isFavorite(`MTR-${selectedLine}-${selectedStation.code}`) ? 'fa-solid' : 'fa-regular'} fa-star`}></i>
                            </button>
                        </div>
                        <div className="grid grid-cols-2 gap-2">
                            <div>
                                <span className="font-semibold text-slate-400">上行</span>
                                {schedule.UP.length > 0 ? schedule.UP.map((t, i) => (
                                    <div key={i} className="bg-white dark:bg-slate-800 p-1.5 rounded mt-1 flex justify-between">
                                        <span>往{MTR_STATION_NAMES[t.dest] || t.dest}</span>
                                        <span className="font-bold text-sky-600">{calculateRemainingMinutes(t.time) <= 0 ? '即到' : `${calculateRemainingMinutes(t.time)}分`}</span>
                                    </div>
                                )) : <div className="text-slate-400 mt-1">暫無班次</div>}
                            </div>
                            <div>
                                <span className="font-semibold text-slate-400">下行</span>
                                {schedule.DOWN.length > 0 ? schedule.DOWN.map((t, i) => (
                                    <div key={i} className="bg-white dark:bg-slate-800 p-1.5 rounded mt-1 flex justify-between">
                                        <span>往{MTR_STATION_NAMES[t.dest] || t.dest}</span>
                                        <span className="font-bold text-sky-600">{calculateRemainingMinutes(t.time) <= 0 ? '即到' : `${calculateRemainingMinutes(t.time)}分`}</span>
                                    </div>
                                )) : <div className="text-slate-400 mt-1">暫無班次</div>}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Green Minibus Section
        function GmbSection({ toggleFavorite, isFavorite }) {
            const [region, setRegion] = useState('HKI');
            const [searchCode, setSearchCode] = useState('');
            const [routesList, setRoutesList] = useState([]);
            const [selectedRoute, setSelectedRoute] = useState(null);
            const [routeStops, setRouteStops] = useState([]);
            const [selectedStop, setSelectedStop] = useState(null);
            const [etaData, setEtaData] = useState([]);
            const [loadingRoutes, setLoadingRoutes] = useState(false);
            const [loadingEta, setLoadingEta] = useState(false);

            useEffect(() => {
                fetch(`https://data.etagmb.gov.hk/route/${region}`)
                    .then(r => r.json())
                    .then(d => setRoutesList(d.data?.routes || []))
                    .catch(() => setRoutesList([]));
            }, [region]);

            const filteredRoutes = useMemo(() => {
                if (!searchCode.trim()) return routesList.slice(0, 20);
                return routesList.filter(r => r.toUpperCase().includes(searchCode.trim().toUpperCase()));
            }, [routesList, searchCode]);

            const handleSelectRoute = async (rCode) => {
                try {
                    const res = await fetch(`https://data.etagmb.gov.hk/route/${region}/${rCode}`);
                    const data = await res.json();
                    const routeInfo = data.data?.[0];
                    if (routeInfo) {
                        setSelectedRoute(routeInfo);
                        const sRes = await fetch(`https://data.etagmb.gov.hk/route-stop/${routeInfo.route_id}/1`);
                        const sData = await sRes.json();
                        setRouteStops(sData.data?.route_stops || []);
                    }
                } catch (e) {}
            };

            const fetchGmbEta = useCallback(async (stop) => {
                if (!selectedRoute || !stop) return;
                setSelectedStop(stop);
                setLoadingEta(true);
                try {
                    const res = await fetch(`https://data.etagmb.gov.hk/eta/route-stop/${selectedRoute.route_id}/1/${stop.stop_seq}`);
                    const data = await res.json();
                    setEtaData(data.data?.eta || []);
                } catch (e) {
                    setEtaData([]);
                } finally {
                    setLoadingEta(false);
                }
            }, [selectedRoute]);

            return (
                <div className="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-slate-200/85 dark:border-slate-700/85 text-xs">
                    <div className="flex items-center justify-between gap-2 mb-3">
                        <span className="font-bold text-emerald-600 flex items-center">
                            <i className="fa-solid fa-van-shuttle mr-1"></i>專線小巴實時到站
                        </span>
                        <div className="flex bg-slate-100 dark:bg-slate-700 p-0.5 rounded-lg font-semibold">
                            {[{key:'HKI', label:'港島'}, {key:'KLN', label:'九龍'}, {key:'NT', label:'新界'}].map(reg => (
                                <button key={reg.key} onClick={() => { setRegion(reg.key); setSelectedRoute(null); }} className={`px-2 py-1 rounded ${region === reg.key ? 'bg-emerald-600 text-white' : ''}`}>{reg.label}</button>
                            ))}
                        </div>
                    </div>

                    <input
                        type="text"
                        value={searchCode}
                        onChange={(e) => setSearchCode(e.target.value)}
                        placeholder="篩選小巴編號 (如: 28)..."
                        className="w-full px-3 py-1.5 bg-slate-50 dark:bg-slate-700/50 rounded-lg border border-slate-200 dark:border-slate-600 mb-2 focus:outline-none"
                    />

                    <div className="flex flex-wrap gap-1 max-h-20 overflow-y-auto mb-3 scrollbar-thin p-1">
                        {filteredRoutes.map(rCode => (
                            <button key={rCode} onClick={() => handleSelectRoute(rCode)} className={`px-2 py-1 rounded font-bold border ${selectedRoute?.route_code === rCode ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-slate-50 dark:bg-slate-700/40'}`}>{rCode}</button>
                        ))}
                    </div>

                    {selectedRoute && (
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div className="max-h-40 overflow-y-auto space-y-1 pr-1 scrollbar-thin">
                                {routeStops.map(stop => (
                                    <button key={stop.stop_seq} onClick={() => fetchGmbEta(stop)} className={`w-full p-1.5 rounded text-left truncate border ${selectedStop?.stop_seq === stop.stop_seq ? 'bg-emerald-50 border-emerald-500 text-emerald-700 font-semibold' : 'bg-slate-50 dark:bg-slate-700/30'}`}>{stop.stop_seq}. {stop.name_tc}</button>
                                ))}
                            </div>
                            <div className="p-3 bg-slate-50 dark:bg-slate-700/30 rounded-xl">
                                {selectedStop ? (
                                    <div className="space-y-2">
                                        <div className="font-bold border-b pb-1 flex justify-between items-center">
                                            <span className="truncate pr-2">{selectedStop.name_tc}</span>
                                            <button onClick={() => toggleFavorite({ id: `GMB-${selectedRoute.route_id}-${selectedStop.stop_seq}`, type: 'GMB', routeId: selectedRoute.route_id, routeCode: selectedRoute.route_code, stopSeq: selectedStop.stop_seq, stopName: selectedStop.name_tc })} className="text-amber-500">
                                                <i className={`${isFavorite(`GMB-${selectedRoute.route_id}-${selectedStop.stop_seq}`) ? 'fa-solid' : 'fa-regular'} fa-star`}></i>
                                            </button>
                                        </div>
                                        {loadingEta ? <div>載入中...</div> : etaData.length > 0 ? etaData.map((eta, i) => (
                                            <div key={i} className="flex justify-between bg-white dark:bg-slate-800 p-1.5 rounded">
                                                <span>班次 {i+1}</span>
                                                <span className="font-bold text-emerald-600">{calculateRemainingMinutes(eta.timestamp) <= 0 ? '即到' : `${calculateRemainingMinutes(eta.timestamp)}分`}</span>
                                            </div>
                                        )) : <div className="text-slate-400">暫無班次</div>}
                                    </div>
                                ) : <div className="text-slate-400 text-center py-6">請選擇車站</div>}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Favorite Card Component
        function FavoriteCard({ fav, toggleFavorite }) {
            const [etaList, setEtaList] = useState([]);

            useEffect(() => {
                const fetchFav = async () => {
                    try {
                        if (fav.type === 'BUS') {
                            const url = fav.company === 'KMB' ? `https://data.etabus.gov.hk/v1/transport/kmb/eta/${fav.stopId}/${fav.route}/1` : `https://rt.data.gov.hk/v1/transport/citybus-nwfb/eta/ctb/${fav.stopId}/${fav.route}`;
                            const res = await fetch(url);
                            const data = await res.json();
                            setEtaList(data.data ? data.data.filter(i => i.eta).slice(0, 1) : []);
                        } else if (fav.type === 'MTR') {
                            const res = await fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${fav.line}&sta=${fav.stationCode}&lang=TC`);
                            const data = await res.json();
                            const key = `${fav.line}-${fav.stationCode}`;
                            if (data.status === 1 && data.data && data.data[key]) {
                                setEtaList([...(data.data[key].UP || []).slice(0, 1)]);
                            }
                        } else if (fav.type === 'GMB') {
                            const res = await fetch(`https://data.etagmb.gov.hk/eta/route-stop/${fav.routeId}/1/${fav.stopSeq}`);
                            const data = await res.json();
                            setEtaList(data.data?.eta ? data.data.eta.slice(0, 1) : []);
                        } else if (fav.type === 'AEE') {
                            setEtaList([{ isAee: true, val: fav.waittime }]);
                        }
                    } catch (e) {}
                };
                fetchFav();
            }, [fav]);

            return (
                <div className="p-3 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 relative text-xs">
                    <button onClick={() => toggleFavorite(fav)} className="absolute top-2 right-2 text-amber-500">
                        <i className="fa-solid fa-star"></i>
                    </button>
                    <div className="font-bold truncate pr-6 text-slate-800 dark:text-slate-100">{fav.stopName || fav.stationName || fav.hospName}</div>
                    <div className="text-[10px] text-slate-400 mb-1">{fav.route ? `${fav.company} ${fav.route}` : fav.lineName || '急症室'}</div>
                    <div className="font-bold text-sky-600">
                        {fav.type === 'AEE' ? fav.waittime : etaList.length > 0 ? `${calculateRemainingMinutes(etaList[0]?.eta || etaList[0]?.time || etaList[0]?.timestamp) <= 0 ? '即到' : `${calculateRemainingMinutes(etaList[0]?.eta || etaList[0]?.time || etaList[0]?.timestamp)}分鐘`}` : '無數據'}
                    </div>
                </div>
            );
        }

        // Clocks
        function Clocks() {

                const timer = setInterval(() => {
                    setTimeStr(new Date().toLocaleTimeString('zh-HK', { timeZone: 'Asia/Hong_Kong', hour12: false }));
                }, 1000);
                return () => clearInterval(timer);
            }, []);
            return (
                <div className="px-2.5 py-1 bg-slate-100 dark:bg-slate-700/60 rounded-lg font-mono text-xs font-semibold">
                    🇭🇰 {timeStr || '--:--:--'}
                </div>
            );
        }

        // Main App Component with iPhone 17 Pro Max Simulator Mode & Font Scaling
        function App() {
            const [darkMode, setDarkMode] = useState(false);
            const [favorites, setFavorites] = useState([]);
            const [activeTab, setActiveTab] = useState('ALL');
            const [isIPhoneFrame, setIsIPhoneFrame] = useState(true);
            const [fontSizeScale, setFontSizeScale] = useState(14); // base font size in px

            useEffect(() => {
                const saved = localStorage.getItem('hk_transit_favs');
                if (saved) try { setFavorites(JSON.parse(saved)); } catch (e) {}
            }, []);

            const toggleFavorite = (item) => {
                let updated = favorites.some(f => f.id === item.id) ? favorites.filter(f => f.id !== item.id) : [...favorites, item];
                setFavorites(updated);
                localStorage.setItem('hk_transit_favs', JSON.stringify(updated));
            };

            const isFavorite = (id) => favorites.some(f => f.id === id);

            return (
                <div style={{ fontSize: `${fontSizeScale}px` }} className="min-h-screen py-4 px-2 sm:px-4 transition-all">
                    {/* iPhone 17 Pro Max Container Wrapper */}
                    <div className={`${isIPhoneFrame ? 'max-w-[430px] mx-auto bg-slate-50 dark:bg-slate-900 border-[8px] border-slate-800 dark:border-slate-700 rounded-[48px] shadow-2xl overflow-hidden my-2 p-3' : 'max-w-5xl mx-auto space-y-4'}`}>
                        
                        {/* Device / View Control Bar */}
                        <div className="flex items-center justify-between bg-white dark:bg-slate-800 px-3 py-2 rounded-xl mb-3 shadow-xs text-xs">
                            <div className="flex items-center gap-1.5 font-bold">
                                <i className="fa-solid fa-mobile-screen text-sky-500"></i>
                                <span>iPhone 17 Pro Max</span>
                            </div>
                            <div className="flex items-center gap-2">
                                <div className="flex items-center gap-1 bg-slate-100 dark:bg-slate-700 px-2 py-0.5 rounded-lg">
                                    <span>字型:</span>
                                    <button onClick={() => setFontSizeScale(s => Math.max(11, s - 1))} className="px-1 font-bold">-</button>
                                    <span>{fontSizeScale}px</span>
                                    <button onClick={() => setFontSizeScale(s => Math.min(22, s + 1))} className="px-1 font-bold">+</button>
                                </div>
                                <button 
                                    onClick={() => setIsIPhoneFrame(!isIPhoneFrame)}
                                    className="px-2 py-1 bg-sky-600 text-white rounded-lg font-bold"
                                >
                                    {isIPhoneFrame ? '全螢幕' : '手機框'}
                                </button>
                                <button 
                                    onClick={() => { setDarkMode(!darkMode); document.documentElement.classList.toggle('dark'); }}
                                    className="p-1.5 bg-slate-100 dark:bg-slate-700 rounded-lg"
                                >
                                    <i className={`fa-solid ${darkMode ? 'fa-sun text-amber-400' : 'fa-moon'}`}></i>
                                </button>
                            </div>
                        </div>

                        {/* App Header */}
                        <header className="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-700 mb-4 space-y-2">
                            <div className="flex justify-between items-center">
                                <h1 className="font-extrabold text-sm sm:text-base bg-gradient-to-r from-sky-600 to-indigo-600 bg-clip-text text-transparent">
                                    香港天氣與交通報告
                                </h1>
                                <Clocks />
                            </div>
                        </header>

                        {favorites.length > 0 && (
                            <section className="mb-4 space-y-2">
                                <h2 className="text-[11px] font-bold text-slate-400 uppercase">我的最愛 ({favorites.length})</h2>
                                <div className="grid grid-cols-2 gap-2">
                                    {favorites.map(fav => <FavoriteCard key={fav.id} fav={fav} toggleFavorite={toggleFavorite} />)}
                                </div>
                            </section>
                        )}

                        <nav className="flex gap-1.5 overflow-x-auto pb-2 mb-4 scrollbar-thin text-xs">
                            {[
                                { key: 'ALL', label: '全部', icon: 'fa-table-cells' },
                                { key: 'BUS', label: '巴士', icon: 'fa-bus' },
                                { key: 'MTR', label: '港鐵', icon: 'fa-train-subway' },
                                { key: 'GMB', label: '小巴', icon: 'fa-van-shuttle' },
                                { key: 'WEATHER', label: '天氣', icon: 'fa-cloud-sun' },
                                { key: 'AEE', label: '急症室', icon: 'fa-hospital' }
                            ].map(tab => (
                                <button
                                    key={tab.key}
                                    onClick={() => setActiveTab(tab.key)}
                                    className={`px-3 py-1.5 rounded-xl font-bold shrink-0 transition flex items-center gap-1.5 border ${activeTab === tab.key ? 'bg-sky-600 text-white border-sky-600' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700'}`}
                                >
                                    <i className={`fa-solid ${tab.icon}`}></i>
                                    <span>{tab.label}</span>
                                </button>
                            ))}
                        </nav>

                        <main className="space-y-4">
                            {(activeTab === 'ALL' || activeTab === 'WEATHER') && <WeatherSection />}
                            {(activeTab === 'ALL' || activeTab === 'AEE') && <AeeSection toggleFavorite={toggleFavorite} isFavorite={isFavorite} />}
                            {(activeTab === 'ALL' || activeTab === 'BUS') && <BusSection toggleFavorite={toggleFavorite} isFavorite={isFavorite} />}
                            {(activeTab === 'ALL' || activeTab === 'MTR') && <MtrSection toggleFavorite={toggleFavorite} isFavorite={isFavorite} />}
                            {(activeTab === 'ALL' || activeTab === 'GMB') && <GmbSection toggleFavorite={toggleFavorite} isFavorite={isFavorite} />}
                        </main>

                        <footer className="text-center py-4 text-[10px] text-slate-400 mt-4 border-t border-slate-200 dark:border-slate-800">
                            香港天文台 • 醫管局 • DATA.GOV.HK
                        </footer>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
