<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港天氣報告、交通及公立醫院急症室輪候時間網頁</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- React 18 & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind Configuration for Dark Mode -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        kmb: '#E31B23',
                        ctb: '#005FA9',
                        mtr: '#990000',
                        gmb: '#008000',
                        hae: '#DC2626'
                    }
                }
            }
        }
    </script>

    <!-- Dynamic Font Size Override & iOS App Styling -->
    <style>
        :root {
            --base-font-size: 16px;
        }
        *, *::before, *::after {
            font-size: var(--base-font-size);
            line-height: 1.4;
        }

        /* Phone Mockup Wrapper */
        .phone-wrapper {
            background-color: #090d16;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        .iphone-frame {
            width: 100%;
            max-width: 430px;
            height: 92vh;
            max-height: 932px;
            background: #f8fafc;
            border-radius: 44px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 10px #1e293b, 0 0 0 13px #334155;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .iphone-screen {
            flex: 1;
            overflow-y: auto;
            position: relative;
            padding-bottom: 90px; /* Space for bottom nav */
        }
        /* iOS Bottom Navigation Bar */
        .ios-bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 75px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(226, 232, 240, 0.8);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 50;
            padding-bottom: env(safe-area-inset-bottom, 10px);
        }
        .dark .ios-bottom-nav {
            background: rgba(15, 23, 42, 0.9);
            border-top: 1px solid rgba(51, 65, 85, 0.8);
        }
        /* Floating Font Size Control Panel */
        .font-control-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            color: white;
            padding: 8px 14px;
            border-radius: 9999px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .font-control-panel * {
            font-size: 13px !important;
        }
        .font-control-panel input[type="range"] {
            accent-color: #0ea5e9;
            cursor: pointer;
            width: 80px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen">
    <!-- Font Size Controller -->
    <div class="font-control-panel">
        <i class="fa-solid fa-font text-sky-400"></i>
        <span>字型: <strong id="fontSizeVal">16</strong>px</span>
        <input type="range" id="fontSizeRange" min="12" max="24" value="16" oninput="updateFontSize(this.value)">
    </div>

    <script>
        function updateFontSize(val) {
            document.documentElement.style.setProperty('--base-font-size', val + 'px');
            document.getElementById('fontSizeVal').innerText = val;
        }
    </script>

    <div class="phone-wrapper">
        <div class="iphone-frame">
            <div class="iphone-screen" id="root"></div>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useMemo } = React;

        const MTR_DATA = {

                    { code: 'JOR', name: '佐敦' }, { code: 'YMT', name: '油麻地' }, { code: 'MOK', name: '旺角' },
                    { code: 'PRE', name: '太子' }, { code: 'SSP', name: '深水埗' }, { code: 'CSW', name: '長沙灣' },
                    { code: 'LCK', name: '荔枝角' }, { code: 'MEI', name: '美孚' }, { code: 'LAK', name: '荔景' }, { code: 'KWF', name: '葵芳' },

                    { code: 'TIK', name: '調景嶺' }, { code: 'TKO', name: '將軍澳' }, { code: 'HAH', name: '坑口' },
                    { code: 'POA', name: '寶琳' }, { code: 'LHP', name: '康城' }

            },
            EAL: {

                stations: [
                    { code: 'ADM', name: '金鐘' }, { code: 'EXC', name: '會展' }, { code: 'HUH', name: '紅磡' },
                    { code: 'MKK', name: '旺角東' }, { code: 'KOT', name: '九龍塘' }, { code: 'TAW', name: '大圍' },
                    { code: 'SHT', name: '沙田' }, { code: 'FOT', name: '火炭' }, { code: 'RAC', name: '馬場' },
                    { code: 'UNI', name: '大學' }, { code: 'TAP', name: '大埔墟' }, { code: 'TWO', name: '太和' },
                    { code: 'FAN', name: '粉嶺' }, { code: 'SHS', name: '上水' }, { code: 'LOW', name: '羅湖' },
                    { code: 'LMC', name: '落馬洲' }

            },

                stations: [
                    { code: 'TUM', name: '屯門' }, { code: 'SIH', name: '兆康' }, { code: 'TIS', name: '天水圍' },
                    { code: 'LOP', name: '朗屏' }, { code: 'YUL', name: '元朗' }, { code: 'KSR', name: '錦上路' },
                    { code: 'TWW', name: '荃灣西' }, { code: 'MEF', name: '美孚' }, { code: 'NAC', name: '南昌' },
                    { code: 'AUS', name: '柯士甸' }, { code: 'ETS', name: '尖東' }, { code: 'HUH', name: '紅磡' },
                    { code: 'HOM', name: '何文田' }, { code: 'TKW', name: '土瓜灣' }, { code: 'SUW', name: '宋皇臺' },
                    { code: 'KAT', name: '啟德' }, { code: 'DIH', name: '鑽石山' }, { code: 'HIK', name: '顯徑' },
                    { code: 'TAW', name: '大圍' }, { code: 'CKT', name: '車公廟' }, { code: 'STW', name: '沙田圍' },
                    { code: 'CIO', name: '第一城' }, { code: 'SHM', name: '石門' }, { code: 'TSH', name: '大水坑' },

                ]
            },
            TCL: {
                name: '東涌綫', color: 'bg-orange-500', code: 'TCL',
                stations: [
                    { code: 'HOK', name: '香港' }, { code: 'KOW', name: '九龍' }, { code: 'OLY', name: '奧運' },
                    { code: 'NAC', name: '南昌' }, { code: 'LAK', name: '荔景' }, { code: 'TSY', name: '青衣' },
                    { code: 'SUN', name: '欣澳' }, { code: 'TUC', name: '東涌' }
                ]
            },
            AEL: {
                name: '機場快綫', color: 'bg-teal-600', code: 'AEL',
                stations: [
                    { code: 'HOK', name: '香港' }, { code: 'KOW', name: '九龍' }, { code: 'TSY', name: '青衣' },
                    { code: 'AIR', name: '機場' }, { code: 'AWE', name: '博覽館' }
                ]
            },
            DRL: {
                name: '迪士尼綫', color: 'bg-pink-500', code: 'DRL',
                stations: [
                    { code: 'SUN', name: '欣澳' }, { code: 'DIS', name: '迪士尼' }
                ]
            }
        };

        const MTR_STATION_NAMES = {};
        Object.values(MTR_DATA).forEach(line => {
            line.stations.forEach(sta => {
                MTR_STATION_NAMES[sta.code] = sta.name;
            });
        });
        MTR_STATION_NAMES['DIS'] = '迪士尼';

        const formatNumberDecimal = (val) => {
            if (val === null || val === undefined || val === '' || isNaN(val)) return '--';
            return Number(val).toFixed(1);
        };

        function calculateRemainingMinutes(timeStr) {
            if (!timeStr) return null;
            try {
                const targetTime = new Date(timeStr).getTime();
                const now = new Date().getTime();
                const diffMs = targetTime - now;
                return Math.floor(diffMs / 60000);
            } catch (e) {
                return null;
            }
        }

        function WeatherSection() {
            const [weather, setWeather] = useState(null);
            const [forecast, setForecast] = useState([]);
            const [warnings, setWarnings] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(false);
            const [selectedDistrict, setSelectedDistrict] = useState(null);
            const [districtSearch, setDistrictSearch] = useState('');

            const fetchWeatherData = useCallback(async () => {
                setLoading(true);
                setError(false);
                try {
                    const timestamp = Date.now();
                    const rhrRes = await fetch(`https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc&_=${timestamp}`);
                    const rhrData = await rhrRes.json();
                    
                    const fndRes = await fetch(`https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc&_=${timestamp}`);
                    const fndData = await fndRes.json();

                    const warnRes = await fetch(`https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc&_=${timestamp}`);
                    const warnData = await warnRes.json();

                    setWeather(rhrData);
                    setForecast(fndData.weatherForecast || []);
                    
                    if (warnData && Object.keys(warnData).length > 0) {
                        const warnList = Object.values(warnData).map(w => w.name).filter(Boolean);
                        setWarnings(warnList);
                    } else {
                        setWarnings([]);
                    }
                } catch (err) {
                    console.error("Error loading weather data:", err);
                    setError(true);
                } finally {
                    setLoading(false);
                }
            }, []);

            useEffect(() => {
                fetchWeatherData();
                const interval = setInterval(fetchWeatherData, 60000);
                return () => clearInterval(interval);
            }, [fetchWeatherData]);

            if (loading && !weather) {
                return (
                    <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-200/80 dark:border-slate-700/80 animate-pulse flex justify-center items-center min-h-[160px]">
                        <div className="text-slate-400 flex items-center gap-2">
                            <i className="fa-solid fa-spinner fa-spin text-xl"></i>
                            <span>正直接連線至香港天文台資料庫載入天氣報告...</span>
                        </div>
                    </div>
                );
            }

            if (error && !weather) {
                return (
                    <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-rose-200 dark:border-rose-900/50 text-center">
                        <p className="text-rose-500 font-semibold mb-2"><i className="fa-solid fa-triangle-exclamation mr-2"></i>無法直接連結香港天文台資料庫</p>
                        <button type="button" onClick={fetchWeatherData} className="px-3 py-1 bg-rose-500 text-white rounded-lg text-sm hover:bg-rose-600 transition">重新嘗試連線</button>
                    </div>
                );
            }

            const districtList = weather?.temperature?.data || [];
            const activeDistrictData = (selectedDistrict && districtList.find(d => d.place.includes(selectedDistrict))) 
                || districtList[0];
            const displayTemp = activeDistrictData?.value;
            const displayPlace = activeDistrictData?.place || '香港天文台';

            const humidity = weather?.humidity?.data?.[0]?.value;
            const uvIndex = weather?.uvindex?.data?.[0]?.value;

            const filteredDistricts = districtList.filter(place => 
                !districtSearch.trim() || place.place.toLowerCase().includes(districtSearch.trim().toLowerCase())
            );

            return (
                <div className="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200/80 dark:border-slate-700/80 transition-all">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 pb-4 border-b border-slate-100 dark:border-slate-700">
                        <div className="flex items-center gap-4">
                            <div className="w-16 h-16 rounded-2xl bg-amber-500/10 text-amber-500 flex items-center justify-center text-[30px] shrink-0">
                                <i className="fa-solid fa-sun-plant-wilt"></i>
                            </div>
                            <div>
                                <div className="flex items-baseline gap-2">
                                    <span className="text-[30px] font-extrabold text-slate-800 dark:text-slate-100 leading-none">{formatNumberDecimal(displayTemp)}°C</span>
                                    <span className="px-2.5 py-0.5 rounded-lg bg-sky-500/10 text-sky-600 dark:text-sky-400 font-bold text-xs border border-sky-500/25">
                                        <i className="fa-solid fa-location-dot mr-1"></i>{displayPlace}
                                    </span>
                                </div>
                                <div className="flex flex-wrap items-center gap-3 text-xs text-slate-500 dark:text-slate-400 mt-1">
                                    <span><i className="fa-solid fa-droplet text-sky-500 mr-1"></i>相對濕度: <strong className="text-slate-700 dark:text-slate-200">{formatNumberDecimal(humidity)}%</strong></span>
                                    {uvIndex !== undefined && uvIndex !== null && (
                                        <span><i className="fa-solid fa-sun text-amber-500 mr-1"></i>UV指數: <strong className="text-slate-700 dark:text-slate-200">{formatNumberDecimal(uvIndex)}</strong></span>
                                    )}
                                    <span className="text-slate-400">天文台直連報告時間: {weather?.updateTime ? weather.updateTime.substring(11, 16) : '--:--'}</span>
                                </div>
                            </div>
                        </div>

                        {warnings.length > 0 ? (
                            <div className="flex flex-wrap gap-2">
                                {warnings.map((warn, i) => (
                                    <span key={i} className="px-3 py-1.5 rounded-lg bg-rose-500/10 text-rose-600 dark:text-rose-400 font-bold text-xs border border-rose-500/20 flex items-center gap-1.5 animate-pulse">
                                        <i className="fa-solid fa-triangle-exclamation"></i>
                                        {warn}
                                    </span>
                                ))}
                            </div>
                        ) : (
                            <div className="text-xs text-emerald-600 dark:text-emerald-400 font-medium px-3 py-1.5 bg-emerald-50 dark:bg-emerald-950/40 rounded-lg border border-emerald-200 dark:border-emerald-800">
                                <i className="fa-solid fa-shield-halved mr-1.5"></i>現時無特別天氣警告
                            </div>
                        )}
                    </div>

                    <div className="mt-4">
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-2.5">
                            <h3 className="text-xs font-semibold text-slate-400 uppercase tracking-wider">
                                全港各區最新氣溫（完整列表 • 點擊切換顯示地區）
                            </h3>
                            <div className="relative w-full sm:w-48">
                                <input
                                    type="text"
                                    value={districtSearch}
                                    onChange={(e) => setDistrictSearch(e.target.value)}
                                    placeholder="搜尋地區 (如: 將軍澳)..."
                                    className="w-full px-2.5 py-1 text-xs bg-slate-50 dark:bg-slate-700/50 rounded-lg border border-slate-200 dark:border-slate-600 focus:outline-none focus:ring-1 focus:ring-sky-500 dark:text-slate-100"
                                />
                            </div>
                        </div>

                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-2 text-xs max-h-64 overflow-y-auto p-1 scrollbar-thin">
                            {filteredDistricts.map((place, idx) => {
                                const isSelected = displayPlace === place.place;
                                return (
                                    <button
                                        key={idx}
                                        type="button"
                                        onClick={() => setSelectedDistrict(place.place)}
                                        className={`p-2.5 rounded-xl flex flex-col justify-between items-center text-center border transition min-h-[58px] ${
                                            isSelected
                                                ? 'bg-sky-600 text-white border-sky-600 shadow-sm font-bold ring-2 ring-sky-300 dark:ring-sky-700'
                                                : 'bg-slate-50 dark:bg-slate-700/50 border-slate-100 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300'
                                        }`}
                                    >
                                        <span className="truncate w-full text-[11px] font-medium leading-tight">{place.place}</span>
                                        <span className={`text-sm tracking-tight ${isSelected ? 'text-white font-black' : 'font-bold text-slate-800 dark:text-slate-100'}`}>
                                            {formatNumberDecimal(place.value)}°C
                                        </span>
                                    </button>
                                );
                            })}
                        </div>
                    </div>

                    <div className="mt-5 pt-4 border-t border-slate-100 dark:border-slate-700">
                        <h3 className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">九天天氣預報</h3>
                        <div className="flex gap-3 overflow-x-auto pb-2 scrollbar-thin">
                            {forecast.slice(0, 7).map((f, idx) => (
                                <div key={idx} className="min-w-[100px] flex-1 p-3 rounded-xl bg-slate-50 dark:bg-slate-700/30 text-center border border-slate-100 dark:border-slate-700/50 shrink-0">
                                    <div className="text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">
                                        {f.forecastDate ? `${f.forecastDate.substring(4, 6)}/${f.forecastDate.substring(6, 8)}` : ''} ({f.week?.replace('星期', '週')})
                                    </div>
                                    <div className="text-sm font-bold text-slate-800 dark:text-slate-100 my-1">
                                        {formatNumberDecimal(f.forecastMintemp?.value)}° - {formatNumberDecimal(f.forecastMaxtemp?.value)}°C
                                    </div>
                                    <div className="text-[11px] text-slate-500 dark:text-slate-400 line-clamp-1" title={f.forecastWeather}>
                                        {f.forecastWeather}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }
        function HKClock() {
            const [timeStr, setTimeStr] = useState('');

            useEffect(() => {
                const updateClock = () => {
                    const now = new Date();
                    const formattedTime = now.toLocaleTimeString('zh-HK', {
                        timeZone: 'Asia/Hong_Kong',
                        hour12: false,
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit'
                    });
                    const formattedDate = now.toLocaleDateString('zh-HK', {
                        timeZone: 'Asia/Hong_Kong',
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit'
                    });
                    setTimeStr(`${formattedDate} ${formattedTime}`);
                };

                updateClock();
                const timer = setInterval(updateClock, 1000);
                return () => clearInterval(timer);
            }, []);

            return (
                <div className="flex items-center gap-2 px-3 py-1.5 bg-slate-100 dark:bg-slate-700/60 rounded-xl text-[30px] font-mono font-semibold text-slate-700 dark:text-slate-200 border border-slate-200/80 dark:border-slate-600/80 shadow-inner">
                    <i className="fa-regular fa-clock text-sky-500"></i>

            const [loadingEta, setLoadingEta] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');

            const handleSearchRoute = async (e) => {
                e.preventDefault();
                if (!searchRoute.trim()) return;
                setLoadingStops(true);
                setErrorMsg('');
                setSelectedRoute(null);
                setSelectedStop(null);
                setEtaList([]);
                setStops([]);
                setBound('outbound');

                const formattedRoute = searchRoute.trim().toUpperCase();

                try {
                    if (company === 'KMB') {
                        const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route/${formattedRoute}/outbound/1`);
                        const data = await res.json();
                        if (data.data) {
                            setSelectedRoute(data.data);
                            loadStops('KMB', formattedRoute, 'outbound');
                        } else {
                            setErrorMsg('找不到該九巴路線');
                        }
                    } else {
                        const res = await fetch(`https://rt.data.gov.hk/v1/transport/citybus-nwfb/route/ctb/${formattedRoute}`);
                        const data = await res.json();
                        if (data.data) {
                            setSelectedRoute(data.data);
                            loadStops('CTB', formattedRoute, 'outbound');
                        } else {
                            setErrorMsg('找不到該城巴路線');
                        }
                    }
                } catch (err) {
                    console.error("Error searching bus route:", err);
                    setErrorMsg('搜尋路線時發生錯誤');
                } finally {
                    setLoadingStops(false);
                }
            };

            const loadStops = async (comp, route, direction) => {
                setLoadingStops(true);
                setErrorMsg('');
                setSelectedStop(null);
                setEtaList([]);
                try {
                    if (comp === 'KMB') {
                        const boundParam = direction === 'outbound' ? 'outbound' : 'inbound';
                        const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${route}/${boundParam}/1`);
                        const data = await res.json();
                        if (data.data && data.data.length > 0) {
                            const stopPromises = data.data.map(item =>
                                fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop/${item.stop}`)
                                    .then(r => r.json())
                                    .then(d => ({ stopId: item.stop, name: d.data?.name_tc || item.stop, seq: item.seq }))
                                    .catch(() => ({ stopId: item.stop, name: item.stop, seq: item.seq }))
                            );
                            const stopDetails = await Promise.all(stopPromises);
                            setStops(stopDetails.sort((a, b) => a.seq - b.seq));
                        } else {
                            setStops([]);
                            setErrorMsg('暫無該方向車站數據');
                        }
                    } else {
                        const ctbDir = direction === 'outbound' ? 'outbound' : 'inbound';
                        const res = await fetch(`https://rt.data.gov.hk/v1/transport/citybus-nwfb/route-stop/ctb/${route}/${ctbDir}`);
                        const data = await res.json();
                        if (data.data && data.data.length > 0) {
                            const stopPromises = data.data.map(item =>
                                fetch(`https://rt.data.gov.hk/v1/transport/citybus-nwfb/stop/${item.stop}`)
                                    .then(r => r.json())
                                    .then(d => ({ stopId: item.stop, name: d.data?.name_tc || item.stop, seq: item.seq }))
                                    .catch(() => ({ stopId: item.stop, name: item.stop, seq: item.seq }))
                            );
                            const stopDetails = await Promise.all(stopPromises);
                            setStops(stopDetails.sort((a, b) => a.seq - b.seq));
                        } else {
                            setStops([]);
                            setErrorMsg('暫無該方向車站數據');
                        }
                    }
                } catch (err) {
                    console.error("Error loading bus stops:", err);
                    setErrorMsg('載入巴士站時發生錯誤');
                } finally {
                    setLoadingStops(false);
                }
            };

            const handleDirectionChange = (newBound) => {
                setBound(newBound);
                if (selectedRoute) {
                    loadStops(company, selectedRoute.route, newBound);
                }
            };

            const fetchETA = useCallback(async (stop) => {
                if (!stop || !selectedRoute) return;
                setSelectedStop(stop);
                setLoadingEta(true);
                try {
                    let url = company === 'KMB'
                        ? `https://data.etabus.gov.hk/v1/transport/kmb/eta/${stop.stopId}/${selectedRoute.route}/1`
                        : `https://rt.data.gov.hk/v1/transport/citybus-nwfb/eta/ctb/${stop.stopId}/${selectedRoute.route}`;
                    
                    const res = await fetch(url);
                    const data = await res.json();
                    
                    if (data.data) {
                        const validEtas = data.data.filter(item => item.eta);
                        setEtaList(validEtas);
                    } else {
                        setEtaList([]);
                    }
                } catch (err) {
                    console.error("Error fetching ETA:", err);
                    setEtaList([]);
                } finally {
                    setLoadingEta(false);
                }
            }, [company, selectedRoute]);

            useEffect(() => {
                if (!selectedStop) return;
                const interval = setInterval(() => {
                    fetchETA(selectedStop);
                }, 60000);
                return () => clearInterval(interval);
            }, [selectedStop, fetchETA]);

            return (
                <div className="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200/80 dark:border-slate-700/80">
                    <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
                        <div className="flex items-center gap-2">
                            <span className="p-2 rounded-xl bg-red-500/10 text-red-600 font-bold text-sm">
                                <i className="fa-solid fa-bus mr-1"></i>專營巴士
                            </span>
                            <span className="text-xs text-slate-400">九巴 & 城巴實時到站</span>
                        </div>

                        <div className="flex bg-slate-100 dark:bg-slate-700/60 p-1 rounded-xl text-xs font-semibold">
                            <button
                                onClick={() => { setCompany('KMB'); setSelectedRoute(null); setStops([]); setSelectedStop(null); setEtaList([]); setBound('outbound'); }}
                                className={`px-3 py-1.5 rounded-lg transition ${company === 'KMB' ? 'bg-red-600 text-white shadow-sm' : 'text-slate-600 dark:text-slate-300'}`}
                            >
                                九巴 KMB
                            </button>
                            <button
                                onClick={() => { setCompany('CTB'); setSelectedRoute(null); setStops([]); setSelectedStop(null); setEtaList([]); setBound('outbound'); }}
                                className={`px-3 py-1.5 rounded-lg transition ${company === 'CTB' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-600 dark:text-slate-300'}`}
                            >
                                城巴 CTB
                            </button>
                        </div>
                    </div>

                    <form onSubmit={handleSearchRoute} className="flex gap-2 mb-4">
                        <div className="relative flex-1">
                            <i className="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                            <input
                                type="text"
                                value={searchRoute}
                                onChange={(e) => setSearchRoute(e.target.value)}
                                placeholder={`輸入${company === 'KMB' ? '九巴' : '城巴'}路線號碼 (例如: 1A, 102, B1)...`}
                                className="w-full pl-9 pr-4 py-2 bg-slate-50 dark:bg-slate-700/50 rounded-xl border border-slate-200 dark:border-slate-600 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 dark:text-slate-100"
                            />
                        </div>
                        <button
                            type="submit"
                            className="px-4 py-2 bg-sky-600 hover:bg-sky-700 text-white font-medium rounded-xl text-sm transition shrink-0 flex items-center gap-1.5"
                        >
                            <i className="fa-solid fa-search"></i>
                            <span>搜尋</span>
                        </button>
                    </form>

                    {errorMsg && (
                        <div className="p-3 bg-rose-50 text-rose-600 rounded-xl text-xs mb-4 border border-rose-200">
                            {errorMsg}
                        </div>
                    )}

                    {selectedRoute && (
                        <div className="space-y-4">
                            <div className="flex flex-wrap items-center justify-between gap-2 p-3 bg-slate-50 dark:bg-slate-700/40 rounded-xl border border-slate-100 dark:border-slate-700">
                                <div>
                                    <span className="text-lg font-black text-slate-800 dark:text-slate-100 mr-2">{selectedRoute.route}</span>
                                    <span className="text-xs text-slate-500 dark:text-slate-400">
                                        {selectedRoute.orig_tc || selectedRoute.orig_en} ➔ {selectedRoute.dest_tc || selectedRoute.dest_en}
                                    </span>
                                </div>
                                <div className="flex bg-white dark:bg-slate-800 p-1 rounded-lg border border-slate-200 dark:border-slate-600 text-xs font-semibold">
                                    <button
                                        type="button"
                                        onClick={() => handleDirectionChange('outbound')}
                                        className={`px-3 py-1 rounded-md transition ${bound === 'outbound' ? 'bg-slate-800 dark:bg-slate-200 text-white dark:text-slate-900' : 'text-slate-500'}`}
                                    >
                                        往 {selectedRoute.dest_tc || '目的地'}
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => handleDirectionChange('inbound')}
                                        className={`px-3 py-1 rounded-md transition ${bound === 'inbound' ? 'bg-slate-800 dark:bg-slate-200 text-white dark:text-slate-900' : 'text-slate-500'}`}
                                    >
                                        往 {selectedRoute.orig_tc || '起點'}
                                    </button>
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div className="space-y-2">
                                    <h4 className="text-xs font-semibold text-slate-400 uppercase">巴士站列表 ({stops.length})</h4>
                                    {loadingStops ? (
                                        <div className="p-8 text-center text-slate-400 text-xs">
                                            <i className="fa-solid fa-spinner fa-spin mr-2"></i>載入車站清單中...
                                        </div>
                                    ) : (
                                        <div className="max-h-60 overflow-y-auto space-y-1.5 pr-1 scrollbar-thin">
                                            {stops.map((stop) => (
                                                <button
                                                    key={stop.stopId}
                                                    type="button"
                                                    onClick={() => fetchETA(stop)}
                                                    className={`w-full p-2.5 rounded-xl text-left text-xs transition flex justify-between items-center border ${selectedStop?.stopId === stop.stopId ? 'bg-sky-50 dark:bg-sky-900/30 border-sky-500 text-sky-700 dark:text-sky-300 font-semibold' : 'bg-slate-50 dark:bg-slate-700/30 border-slate-100 dark:border-slate-700/50 hover:bg-slate-100 dark:hover:bg-slate-700'}`}
                                                >
                                                    <span className="truncate pr-2">{stop.seq}. {stop.name}</span>
                                                    <i className="fa-solid fa-chevron-right text-slate-300 text-[10px]"></i>
                                                </button>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                <div>
                                    <h4 className="text-xs font-semibold text-slate-400 uppercase mb-2">即時班次到站時間</h4>
                                    {selectedStop ? (
                                        <div className="p-4 bg-slate-50 dark:bg-slate-700/40 rounded-xl border border-slate-200/80 dark:border-slate-700 space-y-3">
                                            <div className="flex justify-between items-center border-b border-slate-200 dark:border-slate-600 pb-2">
                                                <span className="font-bold text-sm text-slate-800 dark:text-slate-100">{selectedStop.name}</span>
                                                <div className="flex items-center gap-2">
                                                    <button
                                                        type="button"
                                                        onClick={() => toggleFavorite({
                                                            id: `BUS-${company}-${selectedRoute.route}-${selectedStop.stopId}`,
                                                            type: 'BUS',
                                                            company,
                                                            route: selectedRoute.route,
                                                            stopId: selectedStop.stopId,
                                                            stopName: selectedStop.name,
                                                            dest: selectedRoute.dest_tc || ''
                                                        })}
                                                        className="p-1.5 text-amber-500 hover:scale-110 transition"
                                                        title="加入最愛"
                                                    >
                                                        <i className={`${isFavorite(`BUS-${company}-${selectedRoute.route}-${selectedStop.stopId}`) ? 'fa-solid' : 'fa-regular'} fa-star text-lg`}></i>
                                                    </button>
                                                    <button
                                                        type="button"
                                                        onClick={() => fetchETA(selectedStop)}
                                                        className="p-1.5 text-slate-500 hover:text-sky-500 transition"
                                                        title="手動更新"
                                                    >
                                                        <i className={`fa-solid fa-rotate ${loadingEta ? 'fa-spin' : ''}`}></i>
                                                    </button>
                                                </div>
                                            </div>

                                            {loadingEta ? (
                                                <div className="p-6 text-center text-slate-400 text-xs">
                                                    <i className="fa-solid fa-spinner fa-spin mr-2"></i>載入實時班次中...
                                                </div>
                                            ) : etaList.length > 0 ? (
                                                <div className="space-y-2">
                                                    {etaList.map((eta, i) => {
                                                        const remMins = calculateRemainingMinutes(eta.eta);
                                                        return (
                                                            <div key={i} className="p-2.5 bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-600 flex justify-between items-center text-xs">
                                                                <div>
                                                                    <div className="font-semibold text-slate-700 dark:text-slate-200">
                                                                        往 {eta.dest_tc || selectedRoute.dest_tc || '目的地'}
                                                                    </div>
                                                                    <div className="text-[11px] text-slate-400">
                                                                        {eta.rmk_tc || eta.rmk_en || '預計抵達'} • {eta.eta ? eta.eta.substring(11, 16) : ''}
                                                                    </div>
                                                                </div>
                                                                <div className="text-right">
                                                                    {remMins === null ? (
                                                                        <span className="text-slate-400">無時間數據</span>
                                                                    ) : remMins <= 0 ? (
                                                                        <span className="px-2 py-1 bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 font-bold rounded-md animate-pulse">即將到站</span>
                                                                    ) : (
                                                                        <span className="text-base font-extrabold text-sky-600 dark:text-sky-400">{remMins} <span className="text-xs font-normal">分鐘</span></span>
                                                                    )}
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            ) : (
                                                <div className="p-6 text-center text-slate-400 text-xs">
                                                    未有即時班次數據或服務已結束
                                                </div>
                                            )}
                                        </div>
                                    ) : (
                                        <div className="p-8 text-center text-slate-400 text-xs bg-slate-50 dark:bg-slate-700/20 rounded-xl border border-dashed border-slate-200 dark:border-slate-700">
                                            請在左側選擇車站以檢視即時到站時間
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function MtrSection({ toggleFavorite, isFavorite }) {
            const [selectedLine, setSelectedLine] = useState('KTL');
            const [selectedStation, setSelectedStation] = useState(MTR_DATA['KTL'].stations[0]);
            const [schedule, setSchedule] = useState({ UP: [], DOWN: [] });
            const [loading, setLoading] = useState(false);

            const fetchMtr = useCallback(async () => {
                setLoading(true);
                try {
                    const res = await fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${selectedLine}&sta=${selectedStation.code}&lang=TC`);
                    const data = await res.json();
                    const key = `${selectedLine}-${selectedStation.code}`;
                    if (data?.data?.[key]) {
                        setSchedule({ UP: data.data[key].UP || [], DOWN: data.data[key].DOWN || [] });
                    }
                } catch (e) {
                    setSchedule({ UP: [], DOWN: [] });
                } finally {
                    setLoading(false);
                }
            }, [selectedLine, selectedStation]);

            useEffect(() => {
                fetchMtr();
            }, [fetchMtr]);

            return (
                <div className="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-slate-200/80 dark:border-slate-700/80 space-y-3 text-xs">
                    <div className="flex justify-between items-center">
                        <span className="font-bold text-sm text-red-800 dark:text-red-400 flex items-center gap-1.5"><i className="fa-solid fa-train-subway"></i>港鐵即時班次</span>
                        <button onClick={fetchMtr} className="text-slate-400"><i className={`fa-solid fa-rotate ${loading ? 'fa-spin' : ''}`}></i></button>
                    </div>

                    <div className="flex gap-1.5 overflow-x-auto pb-1">
                        {Object.keys(MTR_DATA).map(lKey => (
                            <button key={lKey} onClick={() => { setSelectedLine(lKey); setSelectedStation(MTR_DATA[lKey].stations[0]); }} className={`px-2.5 py-1 rounded-lg font-bold shrink-0 ${selectedLine === lKey ? 'bg-slate-800 text-white dark:bg-slate-100 dark:text-slate-900' : 'bg-slate-100 dark:bg-slate-700'}`}>
                                {MTR_DATA[lKey].name}
                            </button>
                        ))}
                    </div>

                    <div className="flex flex-wrap gap-1 max-h-28 overflow-y-auto">
                        {MTR_DATA[selectedLine].stations.map(s => (
                            <button key={s.code} onClick={() => setSelectedStation(s)} className={`px-2 py-1 rounded border ${selectedStation.code === s.code ? 'bg-sky-600 text-white border-sky-600' : 'bg-slate-50 dark:bg-slate-700/30 border-slate-200 dark:border-slate-700'}`}>
                                {s.name}
                            </button>
                        ))}
                    </div>

                    <div className="p-3 bg-slate-50 dark:bg-slate-700/40 rounded-xl space-y-2">
                        <div className="font-bold flex justify-between">
                            <span>{MTR_DATA[selectedLine].name} - {selectedStation.name}站</span>
                            <button onClick={() => toggleFavorite({ id: `MTR-${selectedLine}-${selectedStation.code}`, type: 'MTR', line: selectedLine, lineName: MTR_DATA[selectedLine].name, stationCode: selectedStation.code, stationName: selectedStation.name })} className="text-amber-500">
                                <i className={`${isFavorite(`MTR-${selectedLine}-${selectedStation.code}`) ? 'fa-solid' : 'fa-regular'} fa-star`}></i>
                            </button>
                        </div>
                        <div className="grid grid-cols-2 gap-2">
                            <div>
                                <div className="font-semibold text-slate-400 mb-1">上行</div>
                                {schedule.UP.length > 0 ? schedule.UP.map((t, idx) => (
                                    <div key={idx} className="bg-white dark:bg-slate-800 p-1.5 rounded mb-1 flex justify-between text-[11px]">
                                        <span>往 {MTR_STATION_NAMES[t.dest] || t.dest}</span>
                                        <span className="font-bold text-sky-600">{calculateRemainingMinutes(t.time) <= 0 ? '即到' : `${calculateRemainingMinutes(t.time)}分`}</span>
                                    </div>
                                )) : <div className="text-slate-400">暫無</div>}
                            </div>
                            <div>
                                <div className="font-semibold text-slate-400 mb-1">下行</div>
                                {schedule.DOWN.length > 0 ? schedule.DOWN.map((t, idx) => (
                                    <div key={idx} className="bg-white dark:bg-slate-800 p-1.5 rounded mb-1 flex justify-between text-[11px]">
                                        <span>往 {MTR_STATION_NAMES[t.dest] || t.dest}</span>
                                        <span className="font-bold text-sky-600">{calculateRemainingMinutes(t.time) <= 0 ? '即到' : `${calculateRemainingMinutes(t.time)}分`}</span>
                                    </div>
                                )) : <div className="text-slate-400">暫無</div>}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function FavoritesSection({ favorites, toggleFavorite }) {
            if (favorites.length === 0) {
                return (
                    <div className="p-8 text-center text-slate-400 text-xs bg-white dark:bg-slate-800 rounded-2xl border border-dashed border-slate-200 dark:border-slate-700">
                        <i className="fa-regular fa-star text-2xl mb-2 block text-amber-400"></i>
                        尚未加入任何最愛項目。請在各功能頁面點擊星號加入！
                    </div>
                );
            }
            return (
                <div className="space-y-3">
                    <h3 className="text-xs font-bold text-slate-400 uppercase">我的最愛收藏 ({favorites.length})</h3>
                    <div className="space-y-2">
                        {favorites.map(fav => (
                            <div key={fav.id} className="p-3 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 flex justify-between items-center text-xs">
                                <div>
                                    <span className="font-bold">{fav.stopName || fav.stationName || fav.hospName}</span>
                                    <div className="text-[11px] text-slate-400">{fav.type}</div>
                                </div>
                                <button onClick={() => toggleFavorite(fav)} className="text-amber-500"><i className="fa-solid fa-star"></i></button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function App() {
            const [darkMode, setDarkMode] = useState(false);
            const [favorites, setFavorites] = useState([]);
            const [activeTab, setActiveTab] = useState('WEATHER');

            useEffect(() => {
                const saved = localStorage.getItem('hk_transit_favs');
                if (saved) try { setFavorites(JSON.parse(saved)); } catch (e) {}
            }, []);

            const toggleDarkMode = () => {
                setDarkMode(!darkMode);
                document.documentElement.classList.toggle('dark');
            };

            const toggleFavorite = (item) => {
                const updated = favorites.some(f => f.id === item.id) ? favorites.filter(f => f.id !== item.id) : [...favorites, item];
                setFavorites(updated);
                localStorage.setItem('hk_transit_favs', JSON.stringify(updated));
            };

            const isFavorite = (id) => favorites.some(f => f.id === id);

            return (
                <div className="max-w-md mx-auto min-h-full flex flex-col relative pb-16">
                    {/* Header */}
                    <header className="p-4 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center sticky top-0 z-30">
                        <div>
                            <h1 className="text-base font-extrabold bg-gradient-to-r from-sky-600 to-indigo-600 bg-clip-text text-transparent">香港生活助手</h1>
                            <p className="text-[10px] text-slate-400">天氣 • 交通 • 急症室即時數據<HKClock /></p>
                        </div>
                        <div className="flex items-center gap-2">
                            <button onClick={toggleDarkMode} className="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
                                <i className={`fa-solid ${darkMode ? 'fa-sun text-amber-400' : 'fa-moon'}`}></i>
                            </button>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="p-4 space-y-4 flex-1">
                        {activeTab === 'WEATHER' && <WeatherSection />}
                        {activeTab === 'BUS' && <BusSection toggleFavorite={toggleFavorite} isFavorite={isFavorite} />}
                        {activeTab === 'GMB' && <GmbSection toggleFavorite={toggleFavorite} isFavorite={isFavorite} />}
                        {activeTab === 'MTR' && <MtrSection toggleFavorite={toggleFavorite} isFavorite={isFavorite} />}
                        {activeTab === 'AEE' && <AeeSection toggleFavorite={toggleFavorite} isFavorite={isFavorite} />}
                        {activeTab === 'FAV' && <FavoritesSection favorites={favorites} toggleFavorite={toggleFavorite} />}
                    </main>

                    {/* iOS Bottom Navigation Bar */}
                    <nav className="ios-bottom-nav">
                        {[
                            { key: 'WEATHER', label: '天氣', icon: 'fa-cloud-sun' },
                            { key: 'BUS', label: '巴士', icon: 'fa-bus' },
                            { key: 'GMB', label: '專線小巴', icon: 'fa-van-shuttle' },
                            { key: 'MTR', label: '港鐵', icon: 'fa-train-subway' },
                            { key: 'AEE', label: '急症室', icon: 'fa-hospital' },
                            { key: 'FAV', label: '最愛', icon: 'fa-star' }
                        ].map(tab => (
                            <button
                                key={tab.key}
                                onClick={() => setActiveTab(tab.key)}
                                className={`flex flex-col items-center justify-center flex-1 h-full transition ${activeTab === tab.key ? 'text-sky-600 dark:text-sky-400 font-bold' : 'text-slate-400 hover:text-slate-600'}`}
                            >
                                <i className={`fa-solid ${tab.icon} text-lg mb-1`}></i>
                                <span className="text-[11px]">{tab.label}</span>
                            </button>
                        ))}
                    </nav>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
