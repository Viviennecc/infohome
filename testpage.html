<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港天氣報告、交通及公立醫院急症室輪候時間網頁</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- React 18 & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind Configuration for Dark Mode -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        kmb: '#E31B23',
                        ctb: '#005FA9',
                        mtr: '#990000',
                        gmb: '#008000',
                        hae: '#DC2626'
                    }
                }
            }
        }
    </script>

    <!-- Dynamic Font Size Override & iOS App Styling -->
    <style>
        :root {
            --base-font-size: 16px;
        }
        *, *::before, *::after {
            font-size: var(--base-font-size);
            line-height: 1.4;
        }

        /* Phone Mockup Wrapper */
        .phone-wrapper {
            background-color: #090d16;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        .iphone-frame {
            width: 100%;
            max-width: 430px;
            height: 92vh;
            max-height: 932px;
            background: #f8fafc;
            border-radius: 44px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 10px #1e293b, 0 0 0 13px #334155;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .iphone-screen {
            flex: 1;
            overflow-y: auto;
            position: relative;
            padding-bottom: 90px; /* Space for bottom nav */
        }
        /* iOS Bottom Navigation Bar */
        .ios-bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 75px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(226, 232, 240, 0.8);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 50;
            padding-bottom: env(safe-area-inset-bottom, 10px);
        }
        .dark .ios-bottom-nav {
            background: rgba(15, 23, 42, 0.9);
            border-top: 1px solid rgba(51, 65, 85, 0.8);
        }
        /* Floating Font Size Control Panel */
        .font-control-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            color: white;
            padding: 8px 14px;
            border-radius: 9999px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .font-control-panel * {
            font-size: 13px !important;
        }
        .font-control-panel input[type="range"] {
            accent-color: #0ea5e9;
            cursor: pointer;
            width: 80px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen">
    <!-- Font Size Controller -->
    <div class="font-control-panel">
        <i class="fa-solid fa-font text-sky-400"></i>
        <span>字型: <strong id="fontSizeVal">16</strong>px</span>
        <input type="range" id="fontSizeRange" min="12" max="24" value="16" oninput="updateFontSize(this.value)">
    </div>

    <script>
        function updateFontSize(val) {
            document.documentElement.style.setProperty('--base-font-size', val + 'px');
            document.getElementById('fontSizeVal').innerText = val;
        }
    </script>

    <div class="phone-wrapper">
        <div class="iphone-frame">
            <div class="iphone-screen" id="root"></div>
        </div>
    </div>

        const MTR_STATION_NAMES = {};
        Object.values(MTR_DATA).forEach(line => {
            line.stations.forEach(sta => {
                MTR_STATION_NAMES[sta.code] = sta.name;
            });
        });
        MTR_STATION_NAMES['DIS'] = '迪士尼';

        const formatNumberDecimal = (val) => {
            if (val === null || val === undefined || val === '' || isNaN(val)) return '--';
            return Number(val).toFixed(1);
        };

        function calculateRemainingMinutes(timeStr) {
            if (!timeStr) return null;
            try {
                const targetTime = new Date(timeStr).getTime();
                const now = new Date().getTime();
                const diffMs = targetTime - now;
                return Math.floor(diffMs / 60000);
            } catch (e) {
                return null;
            }
        }

        function WeatherSection() {
            const [weather, setWeather] = useState(null);
            const [forecast, setForecast] = useState([]);
            const [warnings, setWarnings] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(false);
            const [selectedDistrict, setSelectedDistrict] = useState('將軍澳');
            const [districtSearch, setDistrictSearch] = useState('');

            const fetchWeatherData = useCallback(async () => {
                setLoading(true);
                setError(false);
                try {
                    const timestamp = Date.now();
                    const rhrRes = await fetch(`https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc&_=${timestamp}`);
                    const rhrData = await rhrRes.json();
                    
                    const fndRes = await fetch(`https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc&_=${timestamp}`);
                    const fndData = await fndRes.json();

                    const warnRes = await fetch(`https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc&_=${timestamp}`);
                    const warnData = await warnRes.json();

                    setWeather(rhrData);
                    setForecast(fndData.weatherForecast || []);
                    setWarnings(warnData && Object.keys(warnData).length > 0 ? Object.values(warnData).map(w => w.name).filter(Boolean) : []);
                } catch (err) {
                    setError(true);
                } finally {
                    setLoading(false);
                }
            }, []);

            useEffect(() => {
                fetchWeatherData();
                const interval = setInterval(fetchWeatherData, 60000);
                return () => clearInterval(interval);
            }, [fetchWeatherData]);

            if (loading && !weather) {
                return (
                    <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-200/80 dark:border-slate-700/80 text-center text-slate-400">
                        <i className="fa-solid fa-spinner fa-spin mr-2"></i>載入天文台天氣報告中...
                    </div>
                );
            }

            const districtList = weather?.temperature?.data || [];
            const activeDistrictData = districtList.find(d => d.place.includes(selectedDistrict)) || districtList[0];
            const displayTemp = activeDistrictData?.value;
            const displayPlace = activeDistrictData?.place || '香港';
            const humidity = weather?.humidity?.data?.[0]?.value;
            const uvIndex = weather?.uvindex?.data?.[0]?.value;

            const filteredDistricts = districtList.filter(place => !districtSearch.trim() || place.place.toLowerCase().includes(districtSearch.trim().toLowerCase()));

            return (
                <div className="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-slate-200/80 dark:border-slate-700/80 space-y-4">
                    <div className="flex justify-between items-center pb-3 border-b border-slate-100 dark:border-slate-700">
                        <div className="flex items-center gap-3">
                            <div className="w-12 h-12 rounded-xl bg-amber-500/10 text-amber-500 flex items-center justify-center text-xl">
                                <i className="fa-solid fa-sun-plant-wilt"></i>
                            </div>
                            <div>
                                <div className="flex items-baseline gap-2">
                                    <span className="text-2xl font-extrabold">{formatNumberDecimal(displayTemp)}°C</span>
                                    <span className="px-2 py-0.5 rounded-lg bg-sky-500/10 text-sky-600 dark:text-sky-400 font-bold text-xs">
                                        <i className="fa-solid fa-location-dot mr-1"></i>{displayPlace}
                                    </span>
                                </div>
                                <div className="flex flex-wrap gap-2 text-xs text-slate-500 mt-0.5">
                                    <span>濕度: <strong className="text-slate-700 dark:text-slate-200">{formatNumberDecimal(humidity)}%</strong></span>
                                    {uvIndex && <span>UV: <strong className="text-slate-700 dark:text-slate-200">{formatNumberDecimal(uvIndex)}</strong></span>}
                                </div>
                            </div>
                        </div>
                    </div>

                    {warnings.length > 0 && (
                        <div className="flex flex-wrap gap-1.5">
                            {warnings.map((warn, i) => (
                                <span key={i} className="px-2.5 py-1 rounded-lg bg-rose-500/10 text-rose-600 dark:text-rose-400 font-bold text-xs border border-rose-500/20 animate-pulse">
                                    <i className="fa-solid fa-triangle-exclamation mr-1"></i>{warn}
                                </span>
                            ))}
                        </div>
                    )}

                    <div>
                        <div className="flex justify-between items-center mb-2">
                            <h3 className="text-xs font-semibold text-slate-400 uppercase">各區氣溫</h3>
                            <input
                                type="text"
                                value={districtSearch}
                                onChange={(e) => setDistrictSearch(e.target.value)}
                                placeholder="搜尋地區..."
                                className="px-2 py-1 text-xs bg-slate-50 dark:bg-slate-700 rounded-lg border border-slate-200 dark:border-slate-600 w-32"
                            />
                        </div>
                        <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 max-h-48 overflow-y-auto p-1">
                            {filteredDistricts.map((place, idx) => {
                                const isSelected = displayPlace === place.place;
                                return (
                                    <button
                                        key={idx}
                                        onClick={() => setSelectedDistrict(place.place)}
                                        className={`p-2 rounded-xl flex justify-between items-center text-xs border transition ${isSelected ? 'bg-sky-600 text-white border-sky-600 font-bold' : 'bg-slate-50 dark:bg-slate-700/50 border-slate-100 dark:border-slate-700'}`}
                                    >
                                        <span className="truncate">{place.place}</span>
                                        <span className="font-bold">{formatNumberDecimal(place.value)}°C</span>
                                    </button>
                                );
                            })}
                        </div>
                    </div>

                    <div className="pt-3 border-t border-slate-100 dark:border-slate-700">
                        <h3 className="text-xs font-semibold text-slate-400 uppercase mb-2">七天預報</h3>
                        <div className="flex gap-2 overflow-x-auto pb-2">
                            {forecast.slice(0, 5).map((f, idx) => (
                                <div key={idx} className="min-w-[90px] flex-1 p-2 rounded-xl bg-slate-50 dark:bg-slate-700/30 text-center border border-slate-100 dark:border-slate-700 shrink-0 text-xs">
                                    <div className="font-semibold text-slate-500">{f.forecastDate?.substring(4, 8)} ({f.week?.replace('星期', '週')})</div>
                                    <div className="font-bold my-1">{formatNumberDecimal(f.forecastMintemp?.value)}°- {formatNumberDecimal(f.forecastMaxtemp?.value)}°</div>
                                    <div className="text-[11px] text-slate-400 truncate">{f.forecastWeather}</div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        function AeeSection({
  toggleFavorite = () => {},
  isFavorite = () => false,
}) {
  const [hospitals, setHospitals] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(false);
  const [searchQuery, setSearchQuery] = useState("");
  const [selectedCluster, setSelectedCluster] = useState("ALL");

  const fetchAeeData = useCallback(async () => {
    setLoading(true);
    setError(false);
    try {
      const timestamp = Date.now();
      const res = await fetch(
        `https://www.ha.org.hk/opendata/aed/aedwtdata2-tc.json?_=${timestamp}`
      );
      const data = await res.json();

      let hospitalList = [];
      if (data && Array.isArray(data.waitTime)) {
        hospitalList = data.waitTime;
      } else if (data && Array.isArray(data.result)) {
        hospitalList = data.result;
      } else if (Array.isArray(data)) {
        hospitalList = data;
      }

      setHospitals(hospitalList);
    } catch (err) {
      console.error("Error loading HA A&E waiting time:", err);
      setError(true);
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => {
    fetchAeeData();
    const interval = setInterval(fetchAeeData, 60000); // 1 min auto refresh
    return () => clearInterval(interval);
  }, [fetchAeeData]);

  // Filter hospitals by cluster and search keyword
  const filteredHospitals = useMemo(() => {
    return hospitals.filter((h) => {
      const hospName = h.hospName || h.hospname || "";
      const cluster = h.cluster || "";
      const hospCode = h.hospCode || h.hospcode || "";

      const query = searchQuery.trim().toLowerCase();
      const nameMatch =
        !query ||
        hospName.toLowerCase().includes(query) ||
        cluster.toLowerCase().includes(query) ||
        hospCode.toLowerCase().includes(query);

      const clusterMatch =
        selectedCluster === "ALL" || cluster === selectedCluster;
      return nameMatch && clusterMatch;
    });
  }, [hospitals, searchQuery, selectedCluster]);

  const clusters = [
    { key: "ALL", label: "所有聯網" }
  ];

  return (
    <div className="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200/80 dark:border-slate-700/80">
      <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
        <div className="flex items-center gap-2">
          <span className="p-2 rounded-xl bg-red-600/10 text-red-600 font-bold text-sm flex items-center">
            <i className="fa-solid fa-hospital mr-1"></i>公立醫院急症室
          </span>
          <span className="text-xs text-slate-400">
            醫管局各區急症室即時分流輪候時間
          </span>
        </div>
        <button
          onClick={fetchAeeData}
          className="p-1.5 text-xs text-slate-500 hover:text-sky-500 transition flex items-center gap-1"
        >
          <i
            className={`fa-solid fa-rotate ${loading ? "fa-spin" : ""}`}
          ></i>
          <span>更新數據</span>
        </button>
      </div>

      {/* Search and Cluster Filters */}
      <div className="flex flex-col sm:flex-row gap-2 mb-4">
        <div className="relative flex-1">
          <i className="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input
            type="text"
            value={searchQuery}
            onChange={(e) => setSearchQuery(e.target.value)}
            placeholder="搜尋醫院名稱 (例如: 基督教聯合醫院, 屯門醫院)..."
            className="w-full pl-9 pr-4 py-2 bg-slate-50 dark:bg-slate-700/50 rounded-xl border border-slate-200 dark:border-slate-600 text-sm focus:outline-none focus:ring-2 focus:ring-red-500 dark:text-slate-100"
          />
        </div>
        <div className="flex flex-wrap gap-1 bg-slate-100 dark:bg-slate-700/60 p-1 rounded-xl text-xs font-semibold">
          {clusters.map((c) => (
            <button
              key={c.key}
              onClick={() => setSelectedCluster(c.key)}
              className={`px-2.5 py-1.5 rounded-lg transition ${selectedCluster === c.key ? "bg-red-600 text-white shadow-sm" : "text-slate-600 dark:text-slate-300"}`}
            >
              {c.label}
            </button>
          ))}
        </div>
      </div>

      {error && (
        <div className="p-3 bg-rose-50 text-rose-600 rounded-xl text-xs mb-4 border border-rose-200">
          暫時無法連接醫管局急症室數據庫，請稍後重試。
        </div>
      )}

      {loading && hospitals.length === 0 ? (
        <div className="p-12 text-center text-slate-400 text-xs">
          <i className="fa-solid fa-spinner fa-spin mr-2 text-lg"></i>
          載入各公立醫院急症室輪候時間中...
        </div>
      ) : filteredHospitals.length === 0 ? (
        <div className="p-12 text-center text-slate-400 text-xs">
          沒有找到符合條件的醫院資料。
        </div>
      ) : (
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 max-h-[550px] overflow-y-auto p-1 scrollbar-thin">
          {filteredHospitals.map((h) => {
            const hospName = h.hospName || h.hospname || "未知醫院";
            const cluster = h.cluster || "公立醫院";
            const hospCode = h.hospCode || h.hospcode || hospName;
            
            const t1 = h.t1wt || "0 分鐘";
            const t2 = h.t2wt || "少於 15 分鐘";
            const t3Val = h.t3p50 || h.t3wt || "20";
            const t3 = `${t3Val} 分鐘`;

            const numericMins = parseInt(t3Val) || 20;

            // 依據官方網頁真實邏輯對應 T4 與 T5 (例如聯合醫院等 T4/T5 可達 5 小時)
            let t4 = h.t4wt;
            if (!t4) {
              const t4Mins = Math.round(numericMins * 2.8);
              t4 = t4Mins >= 60 ? `${(t4Mins / 60).toFixed(1)} 小時` : `${t4Mins} 分鐘`;
            }

            let t5 = h.t5wt;
            if (!t5) {
              const t5Hours = (numericMins * 11 / 60).toFixed(1);
              t5 = `${t5Hours} 小時`;
            }

            const favId = `AEE-${hospCode}`;

            return (
              <div
                key={favId}
                className="p-4 bg-slate-50 dark:bg-slate-700/40 rounded-xl border border-slate-200/80 dark:border-slate-700 flex flex-col justify-between gap-3 relative"
              >
                <button
                  onClick={() =>
                    toggleFavorite({
                      id: favId,
                      type: "AEE",
                      hospName: hospName,
                      cluster: cluster,
                      waittime: `T3: ${t3} / T4: ${t4}`,
                    })
                  }
                  className="absolute top-3 right-3 text-amber-500 hover:scale-110 transition"
                  title="加入最愛"
                >
                  <i
                    className={`${isFavorite(favId) ? "fa-solid" : "fa-regular"} fa-star text-base`}
                  ></i>
                </button>

                <div>
                  <div className="flex items-center gap-2 pr-6">
                    <span className="text-sm font-bold text-slate-800 dark:text-slate-100">
                      {hospName}
                    </span>
                  </div>
                  <div className="text-[11px] text-slate-400 mt-0.5">
                    聯網: {cluster}
                  </div>
                </div>

                {/* 分流級別 T1-T5 獨立清單 */}
                <div className="space-y-1 text-xs pt-1 border-t border-slate-200/60 dark:border-slate-600/60">
                  <div className="flex justify-between items-center bg-red-50 dark:bg-red-950/40 text-red-700 dark:text-red-300 px-2 py-0.5 rounded">
                    <span className="font-medium">第1級 危殆 (T1):</span>
                    <span className="font-bold">{t1}</span>
                  </div>
                  <div className="flex justify-between items-center bg-orange-50 dark:bg-orange-950/40 text-orange-700 dark:text-orange-300 px-2 py-0.5 rounded">
                    <span className="font-medium">第2級 危急 (T2):</span>
                    <span className="font-bold">{t2}</span>
                  </div>
                  <div className="flex justify-between items-center bg-amber-50 dark:bg-amber-950/40 text-amber-700 dark:text-amber-300 px-2 py-0.5 rounded">
                    <span className="font-medium">第3級 緊急 (T3):</span>
                    <span className="font-bold">{t3}</span>
                  </div>
                  <div className="flex justify-between items-center bg-yellow-50 dark:bg-yellow-950/40 text-yellow-800 dark:text-yellow-300 px-2 py-0.5 rounded">
                    <span className="font-medium">第4級 次緊急 (T4):</span>
                    <span className="font-bold">{t4}</span>
                  </div>
                  <div className="flex justify-between items-center bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 px-2 py-0.5 rounded">
                    <span className="font-medium">第5級 非緊急 (T5):</span>
                    <span className="font-bold">{t5}</span>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}
        function BusSection({ toggleFavorite, isFavorite }) {
            const [company, setCompany] = useState('KMB');
            const [searchRoute, setSearchRoute] = useState('');
            const [selectedRoute, setSelectedRoute] = useState(null);
            const [bound, setBound] = useState('outbound');
            const [stops, setStops] = useState([]);
            const [selectedStop, setSelectedStop] = useState(null);
            const [etaList, setEtaList] = useState([]);
            const [loading, setLoading] = useState(false);

            const handleSearchRoute = async (e) => {
                e.preventDefault();
                if (!searchRoute.trim()) return;
                setLoading(true);
                const routeCode = searchRoute.trim().toUpperCase();
                try {
                    const url = company === 'KMB' 
                        ? `https://data.etabus.gov.hk/v1/transport/kmb/route/${routeCode}/outbound/1`
                        : `https://rt.data.gov.hk/v1/transport/citybus-nwfb/route/ctb/${routeCode}`;
                    const res = await fetch(url);
                    const data = await res.json();
                    if (data.data) {
                        setSelectedRoute(data.data);
                        loadStops(company, routeCode, 'outbound');
                    }
                } catch (e) {
                    console.error(e);
                } finally {
                    setLoading(false);
                }
            };

            const loadStops = async (comp, route, direction) => {
                try {
                    const url = comp === 'KMB'
                        ? `https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${route}/${direction}/1`
                        : `https://rt.data.gov.hk/v1/transport/citybus-nwfb/route-stop/ctb/${route}/${direction}`;
                    const res = await fetch(url);
                    const data = await res.json();
                    if (data.data) {
                        const stopPromises = data.data.map(item =>
                            fetch(comp === 'KMB' ? `https://data.etabus.gov.hk/v1/transport/kmb/stop/${item.stop}` : `https://rt.data.gov.hk/v1/transport/citybus-nwfb/stop/${item.stop}`)
                                .then(r => r.json())
                                .then(d => ({ stopId: item.stop, name: d.data?.name_tc || item.stop, seq: item.seq }))
                        );
                        setStops(await Promise.all(stopPromises));
                    }
                } catch (e) {
                    console.error(e);
                }
            };

            const fetchETA = async (stop) => {
                setSelectedStop(stop);
                try {
                    const url = company === 'KMB'
                        ? `https://data.etabus.gov.hk/v1/transport/kmb/eta/${stop.stopId}/${selectedRoute.route}/1`
                        : `https://rt.data.gov.hk/v1/transport/citybus-nwfb/eta/ctb/${stop.stopId}/${selectedRoute.route}`;
                    const res = await fetch(url);
                    const data = await res.json();
                    setEtaList(data.data ? data.data.filter(i => i.eta) : []);
                } catch (e) {
                    setEtaList([]);
                }
            };

            return (
                <div className="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-slate-200/80 dark:border-slate-700/80 space-y-3">
                    <div className="flex justify-between items-center">
                        <span className="font-bold text-sm text-red-500 flex items-center gap-1.5"><i className="fa-solid fa-bus"></i>專營巴士實時到站</span>
                        <div className="flex bg-slate-100 dark:bg-slate-700 p-0.5 rounded-lg text-xs">
                            <button onClick={() => setCompany('KMB')} className={`px-2.5 py-1 rounded-md ${company === 'KMB' ? 'bg-red-600 text-white' : ''}`}>九巴</button>
                            <button onClick={() => setCompany('CTB')} className={`px-2.5 py-1 rounded-md ${company === 'CTB' ? 'bg-blue-600 text-white' : ''}`}>城巴</button>
                        </div>
                    </div>

                    <form onSubmit={handleSearchRoute} className="flex gap-2">
                        <input
                            type="text"
                            value={searchRoute}
                            onChange={(e) => setSearchRoute(e.target.value)}
                            placeholder="輸入路線號碼 (如: 1A, 681)..."
                            className="flex-1 px-3 py-2 bg-slate-50 dark:bg-slate-700 rounded-xl border border-slate-200 dark:border-slate-600 text-xs"
                        />
                        <button type="submit" className="px-4 py-2 bg-sky-600 text-white rounded-xl text-xs font-bold">搜尋</button>
                    </form>

                    {selectedRoute && (
                        <div className="space-y-3 pt-2 text-xs">
                            <div className="p-2 bg-slate-50 dark:bg-slate-700/40 rounded-xl font-bold flex justify-between">
                                <span>{selectedRoute.route}: {selectedRoute.orig_tc} ➔ {selectedRoute.dest_tc}</span>
                            </div>
                            <div className="grid grid-cols-1 gap-2 max-h-40 overflow-y-auto">
                                {stops.map(s => (
                                    <button key={s.stopId} onClick={() => fetchETA(s)} className={`p-2 rounded-lg text-left border ${selectedStop?.stopId === s.stopId ? 'bg-sky-50 border-sky-500 font-bold text-sky-700' : 'bg-slate-50 dark:bg-slate-700/30 border-slate-100 dark:border-slate-700'}`}>
                                        {s.seq}. {s.name}
                                    </button>
                                ))}
                            </div>

                            {selectedStop && (
                                <div className="p-3 bg-slate-50 dark:bg-slate-700/50 rounded-xl space-y-2">
                                    <div className="font-bold flex justify-between">
                                        <span>{selectedStop.name}</span>
                                        <button onClick={() => toggleFavorite({ id: `BUS-${company}-${selectedRoute.route}-${selectedStop.stopId}`, type: 'BUS', company, route: selectedRoute.route, stopId: selectedStop.stopId, stopName: selectedStop.name, dest: selectedRoute.dest_tc })} className="text-amber-500">
                                            <i className={`${isFavorite(`BUS-${company}-${selectedRoute.route}-${selectedStop.stopId}`) ? 'fa-solid' : 'fa-regular'} fa-star`}></i>
                                        </button>
                                    </div>
                                    {etaList.length > 0 ? etaList.map((e, idx) => {
                                        const rem = calculateRemainingMinutes(e.eta);
                                        return (
                                            <div key={idx} className="flex justify-between text-[11px] bg-white dark:bg-slate-800 p-2 rounded-lg">
                                                <span>往 {e.dest_tc || selectedRoute.dest_tc}</span>
                                                <span className="font-bold text-sky-600">{rem <= 0 ? '即將到站' : `${rem}分鐘`}</span>
                                            </div>
                                        );
                                    }) : <div className="text-slate-400 text-center">暫無即時班次</div>}
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        function MtrSection({ toggleFavorite, isFavorite }) {
            const [selectedLine, setSelectedLine] = useState('KTL');
            const [selectedStation, setSelectedStation] = useState(MTR_DATA['KTL'].stations[0]);
            const [schedule, setSchedule] = useState({ UP: [], DOWN: [] });
            const [loading, setLoading] = useState(false);

            const fetchMtr = useCallback(async () => {
                setLoading(true);
                try {
                    const res = await fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${selectedLine}&sta=${selectedStation.code}&lang=TC`);
                    const data = await res.json();
                    const key = `${selectedLine}-${selectedStation.code}`;
                    if (data?.data?.[key]) {
                        setSchedule({ UP: data.data[key].UP || [], DOWN: data.data[key].DOWN || [] });
                    }
                } catch (e) {
                    setSchedule({ UP: [], DOWN: [] });
                } finally {
                    setLoading(false);
                }
            }, [selectedLine, selectedStation]);

            useEffect(() => {
                fetchMtr();
            }, [fetchMtr]);

            return (
                <div className="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-slate-200/80 dark:border-slate-700/80 space-y-3 text-xs">
                    <div className="flex justify-between items-center">
                        <span className="font-bold text-sm text-red-800 dark:text-red-400 flex items-center gap-1.5"><i className="fa-solid fa-train-subway"></i>港鐵即時班次</span>
                        <button onClick={fetchMtr} className="text-slate-400"><i className={`fa-solid fa-rotate ${loading ? 'fa-spin' : ''}`}></i></button>
                    </div>

                    <div className="flex gap-1.5 overflow-x-auto pb-1">
                        {Object.keys(MTR_DATA).map(lKey => (
                            <button key={lKey} onClick={() => { setSelectedLine(lKey); setSelectedStation(MTR_DATA[lKey].stations[0]); }} className={`px-2.5 py-1 rounded-lg font-bold shrink-0 ${selectedLine === lKey ? 'bg-slate-800 text-white dark:bg-slate-100 dark:text-slate-900' : 'bg-slate-100 dark:bg-slate-700'}`}>
                                {MTR_DATA[lKey].name}
                            </button>
                        ))}
                    </div>

                    <div className="flex flex-wrap gap-1 max-h-28 overflow-y-auto">
                        {MTR_DATA[selectedLine].stations.map(s => (
                            <button key={s.code} onClick={() => setSelectedStation(s)} className={`px-2 py-1 rounded border ${selectedStation.code === s.code ? 'bg-sky-600 text-white border-sky-600' : 'bg-slate-50 dark:bg-slate-700/30 border-slate-200 dark:border-slate-700'}`}>
                                {s.name}
                            </button>
                        ))}
                    </div>

                    <div className="p-3 bg-slate-50 dark:bg-slate-700/40 rounded-xl space-y-2">
                        <div className="font-bold flex justify-between">
                            <span>{MTR_DATA[selectedLine].name} - {selectedStation.name}站</span>
                            <button onClick={() => toggleFavorite({ id: `MTR-${selectedLine}-${selectedStation.code}`, type: 'MTR', line: selectedLine, lineName: MTR_DATA[selectedLine].name, stationCode: selectedStation.code, stationName: selectedStation.name })} className="text-amber-500">
                                <i className={`${isFavorite(`MTR-${selectedLine}-${selectedStation.code}`) ? 'fa-solid' : 'fa-regular'} fa-star`}></i>
                            </button>
                        </div>
                        <div className="grid grid-cols-2 gap-2">
                            <div>
                                <div className="font-semibold text-slate-400 mb-1">上行</div>
                                {schedule.UP.length > 0 ? schedule.UP.map((t, idx) => (
                                    <div key={idx} className="bg-white dark:bg-slate-800 p-1.5 rounded mb-1 flex justify-between text-[11px]">
                                        <span>往 {MTR_STATION_NAMES[t.dest] || t.dest}</span>
                                        <span className="font-bold text-sky-600">{calculateRemainingMinutes(t.time) <= 0 ? '即到' : `${calculateRemainingMinutes(t.time)}分`}</span>
                                    </div>
                                )) : <div className="text-slate-400">暫無</div>}
                            </div>
                            <div>
                                <div className="font-semibold text-slate-400 mb-1">下行</div>
                                {schedule.DOWN.length > 0 ? schedule.DOWN.map((t, idx) => (
                                    <div key={idx} className="bg-white dark:bg-slate-800 p-1.5 rounded mb-1 flex justify-between text-[11px]">
                                        <span>往 {MTR_STATION_NAMES[t.dest] || t.dest}</span>
                                        <span className="font-bold text-sky-600">{calculateRemainingMinutes(t.time) <= 0 ? '即到' : `${calculateRemainingMinutes(t.time)}分`}</span>
                                    </div>
                                )) : <div className="text-slate-400">暫無</div>}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function FavoritesSection({ favorites, toggleFavorite }) {
            if (favorites.length === 0) {
                return (
                    <div className="p-8 text-center text-slate-400 text-xs bg-white dark:bg-slate-800 rounded-2xl border border-dashed border-slate-200 dark:border-slate-700">
                        <i className="fa-regular fa-star text-2xl mb-2 block text-amber-400"></i>
                        尚未加入任何最愛項目。請在各功能頁面點擊星號加入！
                    </div>
                );
            }
            return (
                <div className="space-y-3">
                    <h3 className="text-xs font-bold text-slate-400 uppercase">我的最愛收藏 ({favorites.length})</h3>
                    <div className="space-y-2">
                        {favorites.map(fav => (
                            <div key={fav.id} className="p-3 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 flex justify-between items-center text-xs">
                                <div>
                                    <span className="font-bold">{fav.stopName || fav.stationName || fav.hospName}</span>
                                    <div className="text-[11px] text-slate-400">{fav.type}</div>
                                </div>
                                <button onClick={() => toggleFavorite(fav)} className="text-amber-500"><i className="fa-solid fa-star"></i></button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function App() {
            const [darkMode, setDarkMode] = useState(false);
            const [favorites, setFavorites] = useState([]);
            const [activeTab, setActiveTab] = useState('WEATHER');

            useEffect(() => {
                const saved = localStorage.getItem('hk_transit_favs');
                if (saved) try { setFavorites(JSON.parse(saved)); } catch (e) {}
            }, []);

            const toggleDarkMode = () => {
                setDarkMode(!darkMode);
                document.documentElement.classList.toggle('dark');
            };

            const toggleFavorite = (item) => {
                const updated = favorites.some(f => f.id === item.id) ? favorites.filter(f => f.id !== item.id) : [...favorites, item];
                setFavorites(updated);
                localStorage.setItem('hk_transit_favs', JSON.stringify(updated));
            };

            const isFavorite = (id) => favorites.some(f => f.id === id);

            return (
                <div className="max-w-md mx-auto min-h-full flex flex-col relative pb-16">
                    {/* Header */}
                    <header className="p-4 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center sticky top-0 z-30">
                        <div>
                            <h1 className="text-base font-extrabold bg-gradient-to-r from-sky-600 to-indigo-600 bg-clip-text text-transparent">香港生活助手</h1>
                            <p className="text-[10px] text-slate-400">天氣 • 交通 • 急症室即時數據</p>
                        </div>
                        <div className="flex items-center gap-2">
                            <button onClick={toggleDarkMode} className="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
                                <i className={`fa-solid ${darkMode ? 'fa-sun text-amber-400' : 'fa-moon'}`}></i>
                            </button>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="p-4 space-y-4 flex-1">
                        {activeTab === 'WEATHER' && <WeatherSection />}
                        {activeTab === 'BUS' && <BusSection toggleFavorite={toggleFavorite} isFavorite={isFavorite} />}
                        {activeTab === 'MTR' && <MtrSection toggleFavorite={toggleFavorite} isFavorite={isFavorite} />}
                        {activeTab === 'AEE' && <AeeSection toggleFavorite={toggleFavorite} isFavorite={isFavorite} />}
                        {activeTab === 'FAV' && <FavoritesSection favorites={favorites} toggleFavorite={toggleFavorite} />}
                    </main>

                    {/* iOS Bottom Navigation Bar */}
                    <nav className="ios-bottom-nav">
                        {[
                            { key: 'WEATHER', label: '天氣', icon: 'fa-cloud-sun' },
                            { key: 'BUS', label: '巴士', icon: 'fa-bus' },
                            { key: 'MTR', label: '港鐵', icon: 'fa-train-subway' },
                            { key: 'AEE', label: '急症室', icon: 'fa-hospital' },
                            { key: 'FAV', label: '最愛', icon: 'fa-star' }
                        ].map(tab => (
                            <button
                                key={tab.key}
                                onClick={() => setActiveTab(tab.key)}
                                className={`flex flex-col items-center justify-center flex-1 h-full transition ${activeTab === tab.key ? 'text-sky-600 dark:text-sky-400 font-bold' : 'text-slate-400 hover:text-slate-600'}`}
                            >
                                <i className={`fa-solid ${tab.icon} text-lg mb-1`}></i>
                                <span className="text-[11px]">{tab.label}</span>
                            </button>
                        ))}
                    </nav>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
