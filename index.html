// Helper function to format numeric weather values to decimal places
const formatNumberDecimal = (val) => {
    if (val === null || val === undefined || val === '' || isNaN(val)) return '--';
    return Number(val).toFixed(1);
};

// Calculate remaining minutes from timestamp safely
function calculateRemainingMinutes(timeStr) {
    if (!timeStr) return null;
    try {
        const targetTime = new Date(timeStr).getTime();
        const now = new Date().getTime();
        const diffMs = targetTime - now;
        const diffMins = Math.floor(diffMs / 60000);
        return diffMins;
    } catch (e) {
        return null;
    }
}

        // HKO Weather Component
        function WeatherSection() {
            const [weather, setWeather] = useState(null);
            const [forecast, setForecast] = useState([]);
            const [warnings, setWarnings] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(false);
            const [selectedDistrict, setSelectedDistrict] = useState('將軍澳');
            const [districtSearch, setDistrictSearch] = useState('');

            const fetchWeatherData = useCallback(async () => {
                setLoading(true);
                setError(false);
                try {
                    const timestamp = Date.now();
                    // Fetch Current Weather Report directly from Hong Kong Observatory Open Data API
                    const rhrRes = await fetch(`https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc&_=${timestamp}`);
                    const rhrData = await rhrRes.json();
                    
                    // Fetch 9-day Weather Forecast directly from HKO
                    const fndRes = await fetch(`https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc&_=${timestamp}`);
                    const fndData = await fndRes.json();

                    // Fetch Active Warnings directly from HKO
                    const warnRes = await fetch(`https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc&_=${timestamp}`);
                    const warnData = await warnRes.json();

                    setWeather(rhrData);
                    setForecast(fndData.weatherForecast || []);
                    
                    // Format active warnings
                    if (warnData && Object.keys(warnData).length > 0) {
                        const warnList = Object.values(warnData).map(w => w.name).filter(Boolean);
                        setWarnings(warnList);
                    } else {
                        setWarnings([]);
                    }
                } catch (err) {
                    console.error("Error loading weather data directly from HKO API:", err);
                    setError(true);
                } finally {
                    setLoading(false);
                }
            }, []);

            useEffect(() => {
                fetchWeatherData();
                const interval = setInterval(fetchWeatherData, 60000); // 1 min auto refresh
                return () => clearInterval(interval);
            }, [fetchWeatherData]);

            if (loading && !weather) {
                return (
                    <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-200/80 dark:border-slate-700/80 animate-pulse flex justify-center items-center min-h-[160px]">

                            <i className="fa-solid fa-spinner fa-spin text-xl"></i>
                            <span>正直接連線至香港天文台資料庫載入天氣報告...</span>
                        </div>
                    </div>
                );
            }

            if (error && !weather) {

                    <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-rose-200 dark:border-rose-900/50 text-center">

                        <button onClick={fetchWeatherData} className="px-3 py-1 bg-rose-500 text-white rounded-lg text-sm hover:bg-rose-600 transition">重新嘗試連線</button>
                    </div>
                );
            }

            const districtList = weather?.temperature?.data || [];
            // Match user selected district or fallback to Tseung Kwan O or first item
            const activeDistrictData = districtList.find(d => d.place.includes(selectedDistrict)) 
                || districtList.find(d => d.place.includes('將軍澳')) 
                || districtList[0];
            const displayTemp = activeDistrictData?.value;
            const displayPlace = activeDistrictData?.place || '將軍澳';

            const humidity = weather?.humidity?.data?.[0]?.value;
            const uvIndex = weather?.uvindex?.data?.[0]?.value;

            const filteredDistricts = districtList.filter(place => 
                !districtSearch.trim() || place.place.toLowerCase().includes(districtSearch.trim().toLowerCase())
            );

                <div className="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200/80 dark:border-slate-700/80 transition-all">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 pb-4 border-b border-slate-100 dark:border-slate-700">

                                        <span><i className="fa-solid fa-sun text-amber-500 mr-1"></i>UV指數: <strong className="text-slate-700 dark:text-slate-200">{formatNumberDecimal(uvIndex)}</strong></span>
                                    )}
                                    <span className="text-slate-400">天文台直連報告時間: {weather?.updateTime ? weather.updateTime.substring(11, 16) : '--:--'}</span>
                                </div>
                            </div>
                        </div>

                        {/* Active Warning Signals */}
                        {warnings.length > 0 ? (
                            <div className="flex flex-wrap gap-2">
                                {warnings.map((warn, i) => (
                                    <span key={i} className="px-3 py-1.5 rounded-lg bg-rose-500/10 text-rose-600 dark:text-rose-400 font-bold text-xs border border-rose-500/20 flex items-center gap-1.5 animate-pulse">
                                        <i className="fa-solid fa-triangle-exclamation"></i>
                                        {warn}
                                    </span>
                                ))}
                            </div>
                        ) : (
                            <div className="text-xs text-emerald-600 dark:text-emerald-400 font-medium px-3 py-1.5 bg-emerald-50 dark:bg-emerald-950/40 rounded-lg border border-emerald-200 dark:border-emerald-800">
                                <i className="fa-solid fa-shield-halved mr-1.5"></i>現時無特別天氣警告
                            </div>
                        )}
                    </div>

                    {/* Regional Temperature Grid & Search */}
                    <div className="mt-4">
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-2.5">
                            <h3 className="text-xs font-semibold text-slate-400 uppercase tracking-wider">
                                全港各區最新氣溫（完整列表 • 點擊切換顯示地區）
                            </h3>
                            <div className="relative w-full sm:w-48">
                                <input
                                    type="text"
                                    value={districtSearch}
                                    onChange={(e) => setDistrictSearch(e.target.value)}
                                    placeholder="搜尋地區 (如: 將軍澳)..."

                                />
                            </div>
                        </div>

                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-2 text-xs max-h-64 overflow-y-auto p-1 scrollbar-thin">
                            {filteredDistricts.map((place, idx) => {
                                const isSelected = displayPlace === place.place;
                                return (
                                    <button
                                        key={idx}
                                        onClick={() => setSelectedDistrict(place.place)}
                                        className={`p-2 rounded-xl flex justify-between items-center text-left border transition ${
                                            isSelected
                                                ? 'bg-sky-600 text-white border-sky-600 shadow-sm font-bold ring-2 ring-sky-300 dark:ring-sky-700'
                                                : 'bg-slate-50 dark:bg-slate-700/50 border-slate-100 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300'
                                        }`}
                                    >
                                        <span className="truncate mr-1">{place.place}</span>
                                        <span className={`shrink-0 ${isSelected ? 'text-white font-black' : 'font-bold text-slate-800 dark:text-slate-100'}`}>

                                        {f.forecastDate ? `${f.forecastDate.substring(4, 6)}/${f.forecastDate.substring(6, 8)}` : ''} ({f.week?.replace('星期', '週')})
                                    </div>
                                    <div className="text-sm font-bold text-slate-800 dark:text-slate-100 my-1">
                                        {formatNumberDecimal(f.forecastMintemp?.value)}° - {formatNumberDecimal(f.forecastMaxtemp?.value)}°C
                                    </div>
                                    <div className="text-[11px] text-slate-500 dark:text-slate-400 line-clamp-1" title={f.forecastWeather}>
                                        {f.forecastWeather}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        // KMB & Citybus ETA Section
        function BusSection({ toggleFavorite, isFavorite }) {
            const [company, setCompany] = useState('KMB'); // KMB or CTB
            const [searchRoute, setSearchRoute] = useState('');
            const [selectedRoute, setSelectedRoute] = useState(null);
            const [bound, setBound] = useState('outbound'); // 'outbound' or 'inbound'
            const [stops, setStops] = useState([]);
            const [selectedStop, setSelectedStop] = useState(null);
            const [etaList, setEtaList] = useState([]);
            const [loadingStops, setLoadingStops] = useState(false);
            const [loadingEta, setLoadingEta] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');

            // Search Bus Route
            const handleSearchRoute = async (e) => {
                e.preventDefault();
                if (!searchRoute.trim()) return;
                setLoadingStops(true);
                setErrorMsg('');
                setSelectedRoute(null);
                setSelectedStop(null);
                setEtaList([]);
                setStops([]);

                const formattedRoute = searchRoute.trim().toUpperCase();

                try {
                    if (company === 'KMB') {
                        const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route/${formattedRoute}/outbound/1`);
                        const data = await res.json();
                        if (data.data) {
                            setSelectedRoute(data.data);
                            loadStops('KMB', formattedRoute, 'outbound');
                        } else {
                            setErrorMsg('找不到該九巴路線');
                        }
                    } else {
                        // Citybus API route stop list
                        const res = await fetch(`https://rt.data.gov.hk/v1/transport/citybus-nwfb/route/ctb/${formattedRoute}`);
                        const data = await res.json();
                        if (data.data) {
                            setSelectedRoute(data.data);
                            loadStops('CTB', formattedRoute, 'outbound');
                        } else {
                            setErrorMsg('找不到該城巴路線');
                        }
                    }
                } catch (err) {
                    console.error("Error searching bus route:", err);
                    setErrorMsg('搜尋路線時發生錯誤');
                } finally {
                    setLoadingStops(false);
                }
            };

            // Load Stops for Route
            const loadStops = async (comp, route, direction) => {
                setLoadingStops(true);
                setErrorMsg('');
                try {
                    if (comp === 'KMB') {
                        const boundParam = direction === 'outbound' ? 'outbound' : 'inbound';
                        const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${route}/${boundParam}/1`);
                        const data = await res.json();
                        if (data.data && data.data.length > 0) {
                            // Fetch detailed stop names
                            const stopPromises = data.data.map(item =>
                                fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop/${item.stop}`)
                                    .then(r => r.json())
                                    .then(d => ({ stopId: item.stop, name: d.data?.name_tc || item.stop, seq: item.seq }))
                                    .catch(() => ({ stopId: item.stop, name: item.stop, seq: item.seq }))
                            );
                            const stopDetails = await Promise.all(stopPromises);
                            setStops(stopDetails.sort((a, b) => a.seq - b.seq));
                        } else {
                            setStops([]);
                            setErrorMsg('暫無該方向車站數據');
                        }
                    } else {
                        // Citybus direction endpoint format ('inbound' or 'outbound')
                        const ctbDir = direction === 'outbound' ? 'outbound' : 'inbound';
                        const res = await fetch(`https://rt.data.gov.hk/v1/transport/citybus-nwfb/route-stop/ctb/${route}/${ctbDir}`);
                        const data = await res.json();
                        if (data.data && data.data.length > 0) {
                            const stopPromises = data.data.map(item =>
                                fetch(`https://rt.data.gov.hk/v1/transport/citybus-nwfb/stop/${item.stop}`)
                                    .then(r => r.json())
                                    .then(d => ({ stopId: item.stop, name: d.data?.name_tc || item.stop, seq: item.seq }))
                                    .catch(() => ({ stopId: item.stop, name: item.stop, seq: item.seq }))
                            );
                            const stopDetails = await Promise.all(stopPromises);
                            setStops(stopDetails.sort((a, b) => a.seq - b.seq));
                        } else {
                            setStops([]);
                            setErrorMsg('暫無該方向車站數據');
                        }
                    }
                } catch (err) {
                    console.error("Error loading bus stops:", err);
                    setErrorMsg('載入巴士站時發生錯誤');

                    setLoadingStops(false);

            const key = `${selectedLine}-${selectedStation.code}`;
            // Check if status is 1 (normal service) and data exists for the specific station key
            if (data && data.status === 1 && data.data && data.data[key]) {

                setSchedule({
                    UP: Array.isArray(stationData.UP) ? stationData.UP : [],
                    DOWN: Array.isArray(stationData.DOWN) ? stationData.DOWN : []
                });

            }, [routesList, searchCode]);

            const handleSelectRoute = async (routeObj) => {
                setLoadingStops(true);

                setEtaData([]);
                try {
                    const res = await fetch(`https://etagmb.gov.hk/route/${region}/${routeObj.route_code}`);
                    const data = await res.json();
                    // 取得該路線的第一個方向（通常 route_seq 為 1）
                    const routeInfo = data.data?.[0];
                    if (routeInfo) {
                        setSelectedRoute(routeInfo);
                        // Fetch stops for seq 1
                        const sRes = await fetch(`https://etagmb.gov.hk/route-stop/${routeInfo.route_id}/1`);
                        const sData = await sRes.json();
                        setRouteStops(sData.data?.route_stops || []);
                    }
                } catch (err) {
                    console.error("Error fetching GMB stops:", err);
                } finally {
                    setLoadingStops(false);
                }
            };

            // Fetch GMB Real-time ETA
            const fetchGmbEta = useCallback(async (stop) => {
                if (!selectedRoute || !stop) return;
                setSelectedStop(stop);
                setLoadingEta(true);
                try {
                    const res = await fetch(`https://etagmb.gov.hk/eta/route-stop/${selectedRoute.route_id}/1/${stop.stop_seq}`);
                    const data = await res.json();
                    setEtaData(data.data?.[0]?.eta || []);
                } catch (err) {
                    console.error("Error fetching GMB ETA:", err);
                    setEtaData([]);
                } finally {
                    setLoadingEta(false);
                }
            }, [selectedRoute]);

            // Auto refresh GMB ETA every 60 seconds
            useEffect(() => {
                if (!selectedStop) return;
                const interval = setInterval(() => {
                    fetchGmbEta(selectedStop);
                }, 60000);
                return () => clearInterval(interval);
            }, [selectedStop, fetchGmbEta]);

            return (
                <div className="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200/80 dark:border-slate-700/80">
                    <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
                        <div className="flex items-center gap-2">
                            <span className="p-2 rounded-xl bg-emerald-500/10 text-emerald-600 font-bold text-sm">
                                <i className="fa-solid fa-van-shuttle mr-1"></i>專線小巴
                            </span>
                            <span className="text-xs text-slate-400">綠色小巴實時到站</span>
                        </div>

                        {/* Region Selector */}
                        <div className="flex bg-slate-100 dark:bg-slate-700/60 p-1 rounded-xl text-xs font-semibold">
                            {[
                                { key: 'HKI', label: '港島' },
                                { key: 'KLN', label: '九龍' },
                                { key: 'NT', label: '新界' }
                            ].map((reg) => (
                                <button
                                    key={reg.key}
                                    onClick={() => { setRegion(reg.key); setSelectedRoute(null); setSelectedStop(null); }}
                                    className={`px-3 py-1.5 rounded-lg transition ${region === reg.key ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-600 dark:text-slate-300'}`}
                                >
                                    {reg.label}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Filter Input */}
                    <div className="mb-4">
                        <input
                            type="text"
                            value={searchCode}
                            onChange={(e) => setSearchCode(e.target.value)}
                            placeholder="篩選專線小巴號碼 (例如: 28, 69)..."
                            className="w-full px-4 py-2 bg-slate-50 dark:bg-slate-700/50 rounded-xl border border-slate-200 dark:border-slate-600 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 dark:text-slate-100"
                        />
                    </div>

                    {/* Route Chips Grid */}
                    <div className="mb-4">
                        <h4 className="text-xs font-semibold text-slate-400 uppercase mb-2">路線選擇</h4>
                        {loadingRoutes ? (
                            <div className="p-4 text-center text-slate-400 text-xs">
                                <i className="fa-solid fa-spinner fa-spin mr-2"></i>載入小巴路線中...
                            </div>
                        ) : (
                            <div className="flex flex-wrap gap-1.5 max-h-32 overflow-y-auto p-1 scrollbar-thin">
                                {filteredRoutes.map((routeObj, idx) => (
                                    <button
                                        key={routeObj.route_id || idx}
                                        onClick={() => handleSelectRoute(routeObj)}
                                        className={`px-3 py-1 rounded-lg text-xs font-bold transition border ${selectedRoute?.route_code === routeObj.route_code ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-slate-50 dark:bg-slate-700/30 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:bg-slate-100'}`}
                                    >
                                        {routeObj.route_code}
                                    </button>
                                ))}
                            </div>
                        )}
                    </div>

                    {/* Stops and ETA */}
                    {selectedRoute && (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-3 border-t border-slate-100 dark:border-slate-700">
                            {/* Stops List */}
                            <div>
                                <h4 className="text-xs font-semibold text-slate-400 uppercase mb-2">小巴站列表</h4>
                                {loadingStops ? (
                                    <div className="p-6 text-center text-slate-400 text-xs">
                                        <i className="fa-solid fa-spinner fa-spin mr-2"></i>載入車站清單中...
                                    </div>
                                ) : (
                                    <div className="max-h-56 overflow-y-auto space-y-1 pr-1 scrollbar-thin">
                                        {routeStops.map((stop) => (
                                            <button
                                                key={stop.stop_seq}
                                                onClick={() => fetchGmbEta(stop)}
                                                className={`w-full p-2.5 rounded-xl text-left text-xs transition flex justify-between items-center border ${selectedStop?.stop_seq === stop.stop_seq ? 'bg-emerald-50 dark:bg-emerald-900/30 border-emerald-500 text-emerald-700 dark:text-emerald-300 font-semibold' : 'bg-slate-50 dark:bg-slate-700/30 border-slate-100 dark:border-slate-700/50 hover:bg-slate-100 dark:hover:bg-slate-700'}`}
                                            >
                                                <span className="truncate pr-2">{stop.stop_seq}. {stop.name_tc}</span>
                                                <i className="fa-solid fa-chevron-right text-slate-300 text-[10px]"></i>
                                            </button>
                                        ))}
                                    </div>
                                )}
                            </div>

                            {/* ETA Box */}
                            <div>
                                <h4 className="text-xs font-semibold text-slate-400 uppercase mb-2">即時小巴班次</h4>
                                {selectedStop ? (
                                    <div className="p-4 bg-slate-50 dark:bg-slate-700/40 rounded-xl border border-slate-200/80 dark:border-slate-700 space-y-3">
                                        <div className="flex justify-between items-center border-b border-slate-200 dark:border-slate-600 pb-2">
                                            <span className="font-bold text-sm text-slate-800 dark:text-slate-100">{selectedStop.name_tc}</span>
                                            <div className="flex items-center gap-2">
                                                <button
                                                    onClick={() => toggleFavorite({
                                                        id: `GMB-${selectedRoute.route_id}-${selectedStop.stop_seq}`,
                                                        type: 'GMB',
                                                        routeId: selectedRoute.route_id,
                                                        routeCode: selectedRoute.route_code,
                                                        stopSeq: selectedStop.stop_seq,
                                                        stopName: selectedStop.name_tc
                                                    })}
                                                    className="p-1.5 text-amber-500 hover:scale-110 transition"
                                                    title="加入最愛"
                                                >
                                                    <i className={`${isFavorite(`GMB-${selectedRoute.route_id}-${selectedStop.stop_seq}`) ? 'fa-solid' : 'fa-regular'} fa-star text-lg`}></i>
                                                </button>
                                                <button
                                                    onClick={() => fetchGmbEta(selectedStop)}
                                                    className="p-1.5 text-slate-500 hover:text-emerald-500 transition"
                                                >
                                                    <i className={`fa-solid fa-rotate ${loadingEta ? 'fa-spin' : ''}`}></i>
                                                </button>
                                            </div>
                                        </div>

                                        {loadingEta ? (
                                            <div className="p-6 text-center text-slate-400 text-xs">
                                                <i className="fa-solid fa-spinner fa-spin mr-2"></i>載入班次中...
                                            </div>
                                        ) : etaData.length > 0 ? (
                                            <div className="space-y-2">
                                                {etaData.map((eta, i) => {
                                                    const remMins = calculateRemainingMinutes(eta.timestamp);
                                                    return (
                                                        <div key={i} className="p-2.5 bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-600 flex justify-between items-center text-xs">
                                                            <div>
                                                                <span className="font-semibold text-slate-700 dark:text-slate-200">班次 {i + 1}</span>
                                                                <span className="ml-2 text-[11px] text-slate-400">{eta.remarks_tc || '即時預測'}</span>
                                                            </div>
                                                            <div>
                                                                {remMins === null ? (
                                                                    <span className="text-slate-400">--</span>
                                                                ) : remMins <= 0 ? (
                                                                    <span className="px-2 py-0.5 bg-emerald-500/10 text-emerald-600 font-bold rounded animate-pulse">即將抵達</span>
                                                                ) : (
                                                                    <span className="font-extrabold text-emerald-600 dark:text-emerald-400">{remMins} 分鐘</span>
                                                                )}
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        ) : (
                                            <div className="p-6 text-center text-slate-400 text-xs">暫無小巴班次數據</div>
                                        )}
                                    </div>
                                ) : (
                                    <div className="p-8 text-center text-slate-400 text-xs bg-slate-50 dark:bg-slate-700/20 rounded-xl border border-dashed border-slate-200 dark:border-slate-700">
                                        請在左側選擇小巴站
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

// Auto-refreshing Favorite Stop Card
        function FavoriteCard({ fav, toggleFavorite }) {
            const [etaList, setEtaList] = useState([]);
            const [loading, setLoading] = useState(true);

            const fetchFavEta = useCallback(async () => {
                setLoading(true);
                try {
                    if (fav.type === 'BUS') {
                        let url = fav.company === 'KMB'
                            ? `https://data.etabus.gov.hk/v1/transport/kmb/eta/${fav.stopId}/${fav.route}/1`
                            : `https://rt.data.gov.hk/v1/transport/citybus-nwfb/eta/ctb/${fav.stopId}/${fav.route}`;
                        const res = await fetch(url);
                        const data = await res.json();
                        setEtaList(data.data ? data.data.filter(i => i.eta).slice(0, 2) : []);
                    } else if (fav.type === 'MTR') {
                        const res = await fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${fav.line}&sta=${fav.stationCode}&lang=TC`);
                        const data = await res.json();
                        const key = `${fav.line}-${fav.stationCode}`;
                        if (data.status === 1 && data.data && data.data[key]) {
                            const up = data.data[key].UP || [];
                            const down = data.data[key].DOWN || [];
                            setEtaList([...up.slice(0, 1), ...down.slice(0, 1)]);
                        }
                    } else if (fav.type === 'GMB') {
                        const res = await fetch(`https://etagmb.gov.hk/eta/route-stop/${fav.routeId}/1/${fav.stopSeq}`);
                        const data = await res.json();
                        setEtaList(data.data?.[0]?.eta ? data.data[0].eta.slice(0, 2) : []);
                    }
                } catch (e) {
                    console.error("Error fetching fav ETA:", e);
                } finally {
                    setLoading(false);
                }
            }, [fav]);

            // Auto refresh favorite card every 60 seconds
            useEffect(() => {
                fetchFavEta();
                const interval = setInterval(fetchFavEta, 60000);
                return () => clearInterval(interval);
            }, [fetchFavEta]);

            return (
                <div className="p-3.5 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm relative group">
                    <button
                        onClick={() => toggleFavorite(fav)}
                        className="absolute top-2.5 right-2.5 text-amber-500 hover:scale-110 transition"
                        title="取消收藏"
                    >
                        <i className="fa-solid fa-star text-sm"></i>
                    </button>

                    <div className="mb-2 pr-6">
                        <span className="text-xs font-bold px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 mr-2">
                            {fav.type === 'BUS' ? `${fav.company} ${fav.route}` : fav.type === 'MTR' ? `${fav.lineName}` : `小巴 ${fav.routeCode}`}
                        </span>
                        <span className="text-xs font-bold text-slate-800 dark:text-slate-100 truncate block mt-1">
                            {fav.stopName || fav.stationName}
                        </span>
                    </div>

                    {loading ? (
                        <div className="text-[11px] text-slate-400 py-1"><i className="fa-solid fa-spinner fa-spin mr-1"></i>載入中...</div>
                    ) : etaList.length > 0 ? (
                        <div className="space-y-1">
                            {etaList.map((item, idx) => {
                                const timeVal = item.eta || item.time || item.timestamp;
                                const rem = calculateRemainingMinutes(timeVal);
                                const destStr = item.dest_tc ? item.dest_tc : item.dest ? (MTR_STATION_NAMES[item.dest] || item.dest) : null;
                                return (
                                    <div key={idx} className="flex justify-between items-center text-xs">
                                        <span className="text-slate-500 dark:text-slate-400 truncate mr-2">
                                            {destStr ? `往 ${destStr}` : '下班車'}
                                        </span>
                                        <span className="font-bold text-sky-600 dark:text-sky-400 shrink-0">
                                            {rem === null ? '--' : rem <= 0 ? '即將到站' : `${rem} 分鐘`}
                                        </span>
                                    </div>
                                );
                            })}
                        </div>
                    ) : (
                        <div className="text-[11px] text-slate-400">現無班次數據</div>
                    )}
                </div>
            );
        }

        // Live Hong Kong Time Clock (24-hour format with seconds)
        function HKClock() {
            const [timeStr, setTimeStr] = useState('');

            useEffect(() => {
                const updateClock = () => {
                    const now = new Date();
                    const formattedTime = now.toLocaleTimeString('zh-HK', {
                        timeZone: 'Asia/Hong_Kong',
                        hour12: false,
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit'
                    });
                    const formattedDate = now.toLocaleDateString('zh-HK', {
                        timeZone: 'Asia/Hong_Kong',
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit'
                    });
                    setTimeStr(`${formattedDate} ${formattedTime}`);
                };

                updateClock();
                const timer = setInterval(updateClock, 1000);
                return () => clearInterval(timer);
            }, []);

            return (
                <div className="flex items-center gap-2 px-3 py-1.5 bg-slate-100 dark:bg-slate-700/60 rounded-xl text-[30px] font-mono font-semibold text-slate-700 dark:text-slate-200 border border-slate-200/80 dark:border-slate-600/80 shadow-inner">
                    <i className="fa-regular fa-clock text-sky-500"></i>
                    <span>{timeStr || '--:--:--'}</span>
                    <span className="text-xs px-1.5 py-0.5 bg-sky-500/10 text-sky-600 dark:text-sky-400 rounded font-sans shrink-0">HKT</span>
                </div>
            );
        }

        // Main Root Application
        function App() {
            const [darkMode, setDarkMode] = useState(false);
            const [favorites, setFavorites] = useState([]);
            const [activeTab, setActiveTab] = useState('ALL'); // ALL, WEATHER, BUS, MTR, GMB

            // Read favorites from LocalStorage on mount
            useEffect(() => {
                const saved = localStorage.getItem('hk_transit_favs');
                if (saved) {
                    try {
                        setFavorites(JSON.parse(saved));
                    } catch (e) {}
                }
            }, []);

            // Toggle Dark Mode
            const toggleDarkMode = () => {
                setDarkMode(!darkMode);
                document.documentElement.classList.toggle('dark');
            };

            // Toggle Favorites
            const toggleFavorite = (item) => {
                let updated = [];
                if (favorites.some(f => f.id === item.id)) {
                    updated = favorites.filter(f => f.id !== item.id);
                } else {
                    updated = [...favorites, item];
                }
                setFavorites(updated);
                localStorage.setItem('hk_transit_favs', JSON.stringify(updated));
            };

            const isFavorite = (id) => favorites.some(f => f.id === id);

            return (
                <div className="max-w-6xl mx-auto px-4 py-6 space-y-6">
                    {/* Header Bar */}
                    <header className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-700/80">
                        <div className="flex items-center gap-3">
                            <div className="w-12 h-12 rounded-xl bg-sky-500/10 text-sky-600 dark:text-sky-400 flex items-center justify-center text-[30px] font-bold shrink-0">
                                <i className="fa-solid fa-cloud-sun-rain"></i>
                            </div>
                            <div>
                                <h1 className="text-[30px] font-extrabold bg-gradient-to-r from-sky-600 to-indigo-600 dark:from-sky-400 dark:to-indigo-400 bg-clip-text text-transparent leading-tight">
                                    香港天氣報告 & 交通實時到站
                                </h1>
                                <p className="text-xs text-slate-500 dark:text-slate-400 flex items-center gap-2 mt-0.5">
                                    <span>天文台最新天氣報告 • 交通實時到站</span>
                                    <span className="inline-flex items-center gap-1 px-1.5 py-0.5 rounded bg-emerald-100 dark:bg-emerald-900/40 text-emerald-700 dark:text-emerald-300 font-semibold text-[10px]">
                                        <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-ping"></span>
                                        自動重新整理
                                    </span>
                                </p>
                            </div>
                        </div>

                        {/* Control Buttons & HK Clock */}
                        <div className="flex items-center gap-2.5 self-end lg:self-auto flex-wrap">
                            <HKClock />
                            <button
                                onClick={toggleDarkMode}
                                className="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 transition shrink-0 text-[18px]"
                                title="切換深色/淺色模式"
                            >
                                <i className={`fa-solid ${darkMode ? 'fa-sun text-amber-400' : 'fa-moon'}`}></i>
                            </button>
                        </div>
                    </header>

                    {/* Favorites Quick Bar */}
                    {favorites.length > 0 && (
                        <section className="space-y-3">
                            <h2 className="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
                                <i className="fa-solid fa-star text-amber-500"></i> 我的最愛收藏站點 ({favorites.length})
                            </h2>
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                                {favorites.map((fav) => (
                                    <FavoriteCard key={fav.id} fav={fav} toggleFavorite={toggleFavorite} />
                                ))}
                            </div>
                        </section>
                    )}

                    {/* Navigation Tabs */}
                    <nav className="flex gap-2 overflow-x-auto pb-1 scrollbar-thin">
                        {[
                            { key: 'ALL', label: '全部檢視', icon: 'fa-table-cells' },
                            { key: 'FAV', label: '我的最愛', icon: 'fa-star' },
                            { key: 'WEATHER', label: '天文台天氣', icon: 'fa-cloud-sun' },
                            { key: 'BUS', label: '九巴/城巴', icon: 'fa-bus' },
                            { key: 'MTR', label: '港鐵到站', icon: 'fa-train-subway' },
                            { key: 'GMB', label: '專線小巴', icon: 'fa-van-shuttle' },
                        ].map((tab) => (
                            <button
                                key={tab.key}
                                onClick={() => setActiveTab(tab.key)}
                                className={`px-4 py-2 rounded-xl text-xs font-bold shrink-0 transition flex items-center gap-2 border ${activeTab === tab.key ? 'bg-sky-600 text-white border-sky-600 shadow-sm' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:bg-slate-50'}`}
                            >
                                <i className={`fa-solid ${tab.icon}`}></i>
                                <span>{tab.label}</span>
                            </button>
                        ))}
                    </nav>

                    {/* Dynamic Modules Rendering */}
                    <main className="space-y-6">
                        {activeTab === 'FAV' && favorites.length === 0 && (
                            <div className="p-8 text-center text-slate-400 text-sm bg-white dark:bg-slate-800 rounded-2xl border border-dashed border-slate-200 dark:border-slate-700">
                                <i className="fa-regular fa-star text-3xl mb-3 block text-amber-400"></i>
                                尚未加入任何最愛站點。請在各交通分頁中點擊星號加入！
                            </div>
                        )}

                        {(activeTab === 'ALL' || activeTab === 'WEATHER') && (
                            <WeatherSection />
                        )}

                        {(activeTab === 'ALL' || activeTab === 'BUS') && (
                            <BusSection toggleFavorite={toggleFavorite} isFavorite={isFavorite} />
                        )}

                        {(activeTab === 'ALL' || activeTab === 'MTR') && (
                            <MtrSection toggleFavorite={toggleFavorite} isFavorite={isFavorite} />
                        )}

                        {(activeTab === 'ALL' || activeTab === 'GMB') && (
                            <GmbSection toggleFavorite={toggleFavorite} isFavorite={isFavorite} />
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="text-center py-6 text-xs text-slate-400 border-t border-slate-200 dark:border-slate-800">
                        數據來源：香港天文台（最新天氣報告）及資料一線通 DATA.GOV.HK（交通實時到站） • 頁面數據每 60 秒自動重新整理
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
